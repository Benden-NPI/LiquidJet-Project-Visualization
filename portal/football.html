tx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;\n  const N = 5;\n  for (let i = 0; i <= N; i++) {                  // back-panel verticals\n    const t = i / N;\n    const x = b1[0] + (b2[0]-b1[0])*t, y = b1[1] + (b2[1]-b1[1])*t;\n    lineSeg(x, y, x, y - h);\n  }\n  for (let i = 0; i <= 3; i++) {                  // back-panel horizontals\n    const t = i / 3;\n    lineSeg(b1[0], b1[1]-h*t, b2[0], b2[1]-h*t);\n  }\n  lineSeg(p1[0], p1[1]-h, b1[0], b1[1]-h);        // top slopes\n  lineSeg(p2[0], p2[1]-h, b2[0], b2[1]-h);\n}\n\nfunction drawGoal(side) {\n  const lineGx = side === 'left' ? 0 : 12;\n  const backGx = side === 'left' ? -0.55 : 12.55;\n  const gy1 = 3, gy2 = 5, h = 34;\n  const p1 = [isoX(lineGx,gy1), isoY(lineGx,gy1)];\n  const p2 = [isoX(lineGx,gy2), isoY(lineGx,gy2)];\n  const b1 = [isoX(backGx,gy1), isoY(backGx,gy1)];\n  const b2 = [isoX(backGx,gy2), isoY(backGx,gy2)];\n  const net = 'rgba(230,240,255,0.07)';\n  poly([[b1[0],b1[1]-h],[b2[0],b2[1]-h],[b2[0],b2[1]],[b1[0],b1[1]]], net, null);\n  poly([[p1[0],p1[1]-h],[b1[0],b1[1]-h],[b1[0],b1[1]],[p1[0],p1[1]]], net, null);\n  poly([[p2[0],p2[1]-h],[b2[0],b2[1]-h],[b2[0],b2[1]],[p2[0],p2[1]]], net, null);\n  drawNet(p1, p2, b1, b2, h);\n  // back posts (dim)\n  ctx.strokeStyle = '#cdd6dd'; ctx.lineWidth = 2; ctx.lineCap = 'round';\n  lineSeg(b1[0], b1[1], b1[0], b1[1]-h);\n  lineSeg(b2[0], b2[1], b2[0], b2[1]-h);\n  lineSeg(b1[0], b1[1]-h, b2[0], b2[1]-h);\n  lineSeg(p1[0], p1[1]-h, b1[0], b1[1]-h);\n  lineSeg(p2[0], p2[1]-h, b2[0], b2[1]-h);\n  // front posts + crossbar (bright)\n  ctx.strokeStyle = '#f6f8fa'; ctx.lineWidth = 3;\n  lineSeg(p1[0], p1[1], p1[0], p1[1]-h);\n  lineSeg(p2[0], p2[1], p2[0], p2[1]-h);\n  lineSeg(p1[0], p1[1]-h, p2[0], p2[1]-h);\n}\n\n// ── HUD: scoreboard + goal flash ──\nfunction drawScoreboard() {\n  ctx.save();\n  const cx = W/2, y = 8, bw = 178, bh = 22;\n  ctx.fillStyle = 'rgba(3,10,22,0.88)';\n  ctx.fillRect(cx-bw/2, y, bw, bh);\n  ctx.strokeStyle = '#244a6a'; ctx.lineWidth = 1;\n  ctx.strokeRect(cx-bw/2+0.5, y+0.5, bw, bh);\n  ctx.font = '7px \"Press Start 2P\"';\n  ctx.textAlign = 'right';  ctx.fillStyle = '#7cc4ff'; ctx.fillText('ARG', cx-26, y+14);\n  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe066'; ctx.fillText(scoreA + ' - ' + scoreB, cx, y+14);\n  ctx.textAlign = 'left';   ctx.fillStyle = '#ff6a6a'; ctx.fillText('ROJO', cx+26, y+14);\n  ctx.restore();\n}\n\nfunction drawGoalFlash() {\n  if (goalFlash <= 0) return;\n  ctx.save();\n  ctx.globalAlpha = Math.min(1, goalFlash / 36);\n  ctx.textAlign = 'center';\n  ctx.font = '30px \"Press Start 2P\"';\n  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;\n  ctx.strokeText('GOAL!', W/2, H/2);\n  ctx.fillStyle = '#ffe066';\n  ctx.fillText('GOAL!', W/2, H/2);\n  ctx.restore();\n  goalFlash--;\n}\n\nkickoff();\n\n// ── control UI wiring ──\nconst ctrlToggle = document.getElementById('ctrl-toggle');\nconst ctrlHelp = document.getElementById('ctrl-help');\nfunction updateCtrlUI() {\n  ctrlToggle.textContent = controlEnabled ? '🎮 控制球員：開' : '🎮 控制球員：關';\n  ctrlToggle.classList.toggle('on', controlEnabled);\n  if (!controlEnabled)      ctrlHelp.textContent = '';\n  else if (!controlled)     ctrlHelp.textContent = '▶ 點場上一名球員接管';\n  else                      ctrlHelp.textContent = `控制中：${controlled.name} · WASD／方向鍵移動 · 空白鍵射門 · 點其他球員換人`;\n}\nctrlToggle.addEventListener('click', () => {\n  controlEnabled = !controlEnabled;\n  if (!controlEnabled) {\n    controlled = null;\n    keys.up = keys.down = keys.left = keys.right = keys.kick = false;\n  }\n  updateCtrlUI();\n  ctrlToggle.blur();   // so SPACE doesn't re-toggle the button\n});\nupdateCtrlUI();\n\nfunction setKey(e, down) {\n  if (!controlEnabled || modalIsOpen()) return;\n  let hit = true;\n  switch (e.key) {\n    case 'ArrowUp': case 'w': case 'W':    keys.up = down; break;\n    case 'ArrowDown': case 's': case 'S':  keys.down = down; break;\n    case 'ArrowLeft': case 'a': case 'A':  keys.left = down; break;\n    case 'ArrowRight': case 'd': case 'D': keys.right = down; break;\n    case ' ':                              keys.kick = down; break;\n    default: hit = false;\n  }\n  if (hit) e.preventDefault();\n}\nwindow.addEventListener('keydown', e => setKey(e, true));\nwindow.addEventListener('keyup',   e => setKey(e, false));\n\nfunction render() {\n  time++;\n  tickMatch();\n  ctx.clearRect(0, 0, W, H);\n  const hot = [];\n\n  drawFootballField();\n  drawStadiumWalls();\n\n  // wall billboards (kept) — deepest, drawn right after the stands.\n  const vizBox = drawWallPanelLeft(1.7, FEATURES.viz.label, FEATURES.viz.color, '🎨');\n  hot.push({ bbox:vizBox, kind:'feature', label:FEATURES.viz.label, ref:FEATURES.viz });\n  const flatBox = drawWallPanelLeft(3.7, FEATURES.flat.label, FEATURES.flat.color, '📐');\n  hot.push({ bbox:flatBox, kind:'feature', label:FEATURES.flat.label, ref:FEATURES.flat });\n  const stretchBox = drawWallPanelLeft(5.7, FEATURES.stretch.label, FEATURES.stretch.color, '📏');\n  hot.push({ bbox:stretchBox, kind:'feature', label:FEATURES.stretch.label, ref:FEATURES.stretch });\n  const cpBox = drawWallPanelLeft(7.7, FEATURES.cp.label, FEATURES.cp.color, '🛡️');\n  hot.push({ bbox:cpBox, kind:'feature', label:FEATURES.cp.label, ref:FEATURES.cp });\n  hot.push(drawYieldPanel());\n\n  // ground objects sorted back-to-front by depth (gx+gy)\n  const ground = [];\n  ground.push({ depth: 0 + 4,  draw: () => drawGoal('left')  });   // left goal (far)\n  ground.push({ depth: 12 + 4, draw: () => drawGoal('right') });   // right goal (near)\n  // The 10 players at their live match positions.\n  EMPLOYEES.forEach(emp => ground.push({\n    depth: employeeDepth(emp),\n    draw: () => {\n      const bbox = drawEmployeeChar(emp);\n      hot.push({ bbox, kind:'employee', ref:emp });\n    },\n  }));\n  // The ball.\n  ground.push({ depth: ball.x + ball.y + 0.2, draw: () => drawBall() });\n  ground.sort((a,b)=>a.depth-b.depth).forEach(o=>o.draw());\n\n  drawScoreboard();\n  drawGoalFlash();\n\n  hotspots = hot;\n  requestAnimationFrame(render);\n}\n\n// Yield = tall sideline LED billboard on the back-right wall (gx=0 edge)\nfunction drawYieldPanel() {\n  const f = FEATURES.yield;\n  const bH=96, bW=0.18, bD=1.8, bGy=2.4-bD/2, bGx=0.01;\n  const hovered = hoverHot && hoverHot.kind==='feature' && hoverHot.label===f.label;\n\n  // Board body — thin slab along the gx=0 edge, facing +gx (toward viewer)\n  drawBox(bGx, bGy, bW, bD, bH,\n    '#0a1122',\n    hovered ? '#1a3050' : '#0c1a2e',\n    hovered ? '#1a2a3a' : '#080e1a',\n    hovered ? f.color : '#1a2a3a');\n\n  // Front face = right face of this box (+gx direction, viewer-facing from this side)\n  const fGx = bGx + bW;\n  const ft = [isoX(fGx, bGy),    isoY(fGx, bGy)];      // top-right (small gy)\n  const fb = [isoX(fGx, bGy+bD), isoY(fGx, bGy+bD)];   // bottom-left (large gy)\n  const ftt = [ft[0], ft[1]-bH];\n  const fbt = [fb[0], fb[1]-bH];\n\n  // LED screen fill\n  const ins=3;\n  poly([\n    [ft[0]-ins, ft[1]-ins],\n    [fb[0]+ins, fb[1]-ins],\n    [fbt[0]+ins, fbt[1]+ins],\n    [ftt[0]-ins, ftt[1]+ins],\n  ], hovered ? '#001428' : '#000a1c', hovered ? f.color+'44' : '#002244');\n\n  // Content: yield chart pixels on the face\n  const fcx = (ft[0]+fb[0])*0.5;\n  const topY = (ftt[1]+fbt[1])*0.5;\n  const botY = (ft[1]+fb[1])*0.5;\n  const midY = (topY+botY)*0.5;\n\n  const pulse = 0.82 + 0.18*Math.sin(time*0.07 + 0.5);\n  // Draw in the FACE's sheared space so the text + chart baselines stay\n  // parallel to the board's top edge (ftt→fbt slopes down to the LEFT here).\n  const ang = Math.atan2(fbt[1]-ftt[1], fbt[0]-ftt[0]);\n  const faceLen = Math.hypot(fbt[0]-ftt[0], fbt[1]-ftt[1]);\n  const ca = Math.cos(ang), sa = Math.sin(ang);\n  const midX = faceLen/2;\n  ctx.save(); ctx.globalAlpha = pulse;\n  ctx.transform(ca, sa, 0, 1, ftt[0], ftt[1]);\n  ctx.textAlign='center'; ctx.textBaseline='middle';\n\n  ctx.fillStyle = hovered ? '#ffe066' : '#aacc44';\n  ctx.font='4px \"Press Start 2P\"';\n  ctx.fillText('⚽ FIFA 2026', midX, bH*0.14);\n\n  ctx.font='13px \"Press Start 2P\"';\n  ctx.fillText('📈', midX, bH*0.40);\n\n  ctx.fillStyle = hovered ? '#ffe066' : f.color;\n  ctx.font='5px \"Press Start 2P\"';\n  ctx.fillText('YIELD ▲', midX, bH*0.55);\n\n  // Tiny yield bar chart — baseline runs parallel to the board's top edge.\n  ctx.textBaseline='alphabetic';\n  const barData = [3,5,4,6,5,8,7,9,8,10];\n  const barW = 2, barGap = 1;\n  const totalW = barData.length*(barW+barGap)-barGap;\n  const barBaseX = midX - totalW/2;\n  const barBaseY = bH*0.86;\n  barData.forEach((v, i) => {\n    const bx = barBaseX + i*(barW+barGap);\n    const bh = v * 1.3;\n    ctx.fillStyle = i === barData.length-1\n      ? (hovered?'#bbffcc':'#66ee88')\n      : (hovered?'#66ee88':'#33aa55');\n    ctx.fillRect(bx, barBaseY-bh, barW, bh);\n  });\n\n  ctx.restore();\n\n  // Animated LED strip along top\n  const ledStep = Math.floor(time / 8) % 6;\n  for (let li=0; li<6; li++) {\n    const lx = ftt[0] + (fbt[0]-ftt[0])*(li+0.5)/6;\n    const ly = ftt[1] + (fbt[1]-ftt[1])*(li+0.5)/6 + 3;\n    ctx.fillStyle = li===ledStep ? (hovered?'#ffe066':f.color) : '#0a1a22';\n    ctx.fillRect(lx-1, ly-1, 2, 2);\n  }\n\n  // Two support poles\n  [[0.28],[0.72]].forEach(([fy]) => {\n    const px = ft[0]+(fb[0]-ft[0])*fy;\n    const py = ft[1]+(fb[1]-ft[1])*fy;\n    ctx.strokeStyle='#3a5060'; ctx.lineWidth=2.5;\n    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py+16); ctx.stroke();\n  });\n\n  const minX=Math.min(ft[0],fb[0],ftt[0],fbt[0]);\n  const maxX=Math.max(ft[0],fb[0],ftt[0],fbt[0]);\n  return { bbox:{x:minX, y:Math.min(ftt[1],fbt[1]), w:maxX-minX, h:Math.max(ft[1],fb[1])-Math.min(ftt[1],fbt[1])}, kind:'feature', label:f.label, ref:f };\n}\n\nrequestAnimationFrame(render);\n\n// ════════════════════════════════════════════\n//  INTERACTION\n// ════════════════════════════════════════════\nfunction hitTest(mx, my) {\n  // prefer employees / table (front) over wall panels: iterate reversed\n  for (let i = hotspots.length-1; i >= 0; i--) {\n    const hsp = hotspots[i], b = hsp.bbox;\n    if (mx>=b.x && mx<=b.x+b.w && my>=b.y && my<=b.y+b.h) return hsp;\n  }\n  return null;\n}\n\nfunction toScene(e) {\n  const r = canvas.getBoundingClientRect();\n  return { mx:(e.clientX-r.left)*(W/r.width), my:(e.clientY-r.top)*(H/r.height) };\n}\n\n// ── Drag state ──────────────────────────────────────────────────────────────\nlet dragItem  = null;   // 'coffee' | 'meeting' | 'foosball' | null\nlet dragStart = null;   // { mx, my, gx0, gy0 }\nlet dragMoved = false;  // true once the pointer has moved during a drag\n\n// Inverse isometric transform: screen delta → grid delta\nfunction screenToGrid(dsx, dsy) {\n  return {\n    dgx: (dsx / TW2 + dsy / TH2) / 2,\n    dgy: (dsy / TH2 - dsx / TW2) / 2,\n  };\n}\n\n// Map a hotspot to the draggable furniture key (or null).\nfunction hotToDragItem(hsp) {\n  if (!hsp) return null;\n  if (hsp.kind === 'leisure' && hsp.ref === 'coffee')    return 'coffee';\n  if (hsp.kind === 'leisure' && hsp.ref === 'foosball')  return 'foosball';\n  if (hsp.kind === 'feature' && hsp.ref === FEATURES.debate) return 'meeting';\n  return null;\n}\n\n// Apply drag delta to the active drag item, clamping to the floor boundary.\nfunction applyDragDelta(mx, my) {\n  const { dgx, dgy } = screenToGrid(mx - dragStart.mx, my - dragStart.my);\n  const maxGx = GW - FURNITURE_BOUNDARY_MARGIN;\n  const maxGy = GH - FURNITURE_BOUNDARY_MARGIN;\n  DRAG_POSITIONS[dragItem].gx = Math.max(0, Math.min(maxGx, dragStart.gx0 + dgx));\n  DRAG_POSITIONS[dragItem].gy = Math.max(0, Math.min(maxGy, dragStart.gy0 + dgy));\n}\n\ncanvas.addEventListener('mousemove', e => {\n  const { mx, my } = toScene(e);\n  if (dragItem) {\n    applyDragDelta(mx, my);\n    dragMoved = true;\n    canvas.style.cursor = 'grabbing';\n    return;\n  }\n  hoverHot = hitTest(mx, my);\n  const draggable = hotToDragItem(hoverHot) !== null;\n  canvas.style.cursor = draggable ? 'grab' : (hoverHot ? 'pointer' : 'default');\n});\n\ncanvas.addEventListener('mousedown', e => {\n  if (e.button !== 0) return;\n  const { mx, my } = toScene(e);\n  const hsp = hitTest(mx, my);\n  const item = hotToDragItem(hsp);\n  if (!item) return;\n  dragItem  = item;\n  dragStart = { mx, my, gx0: DRAG_POSITIONS[item].gx, gy0: DRAG_POSITIONS[item].gy };\n  dragMoved = false;\n  canvas.style.cursor = 'grabbing';\n  e.preventDefault();\n});\n\ndocument.addEventListener('mouseup', () => {\n  if (!dragItem) return;\n  if (dragMoved) saveFurniture();\n  dragItem  = null;\n  dragStart = null;\n  // dragMoved is kept true until the click event so the click handler can\n  // detect that a drag (not a tap) just ended and suppress the action.\n});\n\nfunction handleHit(hsp) {\n  if (hsp.kind === 'feature') {\n    const f = hsp.ref;\n    // Meeting table: open the topic-input modal instead of going straight\n    // to the debate page — Benden decides what the room is about first.\n    if (f === FEATURES.debate) {\n      openMeeting();\n      return;\n    }\n    if (f.newTab) window.open(f.url, '_blank', 'noopener');\n    else window.location.href = f.url;\n  } else if (hsp.kind === 'employee') {\n    if (controlEnabled) { controlled = hsp.ref; updateCtrlUI(); }\n    else openCard(hsp.ref);\n  } else if (hsp.kind === 'leisure') {\n    openLeisure(hsp.ref);\n  }\n}\n\ncanvas.addEventListener('click', e => {\n  if (dragMoved) { dragMoved = false; return; }  // was a drag, not a click\n  const { mx, my } = toScene(e);\n  const hsp = hitTest(mx, my);\n  if (hsp) handleHit(hsp);\n});\n\n// touch support (drag + tap)\ncanvas.addEventListener('touchstart', e => {\n  const t = e.touches[0]; if (!t) return;\n  const { mx, my } = toScene(t);\n  const hsp = hitTest(mx, my);\n  const item = hotToDragItem(hsp);\n  if (item) {\n    dragItem  = item;\n    dragStart = { mx, my, gx0: DRAG_POSITIONS[item].gx, gy0: DRAG_POSITIONS[item].gy };\n    dragMoved = false;\n    e.preventDefault();\n    return;\n  }\n  if (!hsp) return;\n  e.preventDefault();\n  handleHit(hsp);\n}, { passive:false });\n\ncanvas.addEventListener('touchmove', e => {\n  if (!dragItem) return;\n  e.preventDefault();\n  const t = e.touches[0]; if (!t) return;\n  const { mx, my } = toScene(t);\n  applyDragDelta(mx, my);\n  dragMoved = true;\n}, { passive:false });\n\ncanvas.addEventListener('touchend', e => {\n  if (!dragItem) return;\n  if (dragMoved) {\n    saveFurniture();\n    dragMoved = false;\n  } else {\n    // Tap without movement — use the final touch position for the hit test.\n    const t = e.changedTouches[0];\n    const { mx, my } = t ? toScene(t) : dragStart;\n    const hsp = hitTest(mx, my);\n    if (hsp) handleHit(hsp);\n  }\n  dragItem  = null;\n  dragStart = null;\n});\n\n// ── employee card ──\nconst cardOverlay = document.getElementById('card-overlay');\nfunction drawCardAvatar(emp) {\n  const ac = document.getElementById('card-avatar');\n  const a = ac.getContext('2d'); a.imageSmoothingEnabled=false; a.clearRect(0,0,48,48);\n  a.fillStyle=rgbStr(emp.hair); a.fillRect(10,4,28,12);\n  a.fillStyle=rgbStr(emp.skin); a.fillRect(12,12,24,20);\n  a.fillStyle='#111'; a.fillRect(17,19,4,4); a.fillRect(28,19,4,4);\n  a.fillStyle='#aa6655'; a.fillRect(20,28,8,3);\n  a.fillStyle=rgbStr(emp.shirt); a.fillRect(8,32,32,16);\n}\nfunction openCard(emp) {\n  drawCardAvatar(emp);\n  document.getElementById('card-name').textContent = emp.name;\n  document.getElementById('card-role').textContent = `[ ${emp.role} ]  ${emp.roleZh}`;\n  document.getElementById('card-desc').textContent = emp.desc || '';\n  const tags = document.getElementById('card-tags');\n  tags.innerHTML='';\n  [emp.role, emp.roleZh].forEach(t=>{ const s=document.createElement('span'); s.className='card-tag'; s.textContent='▶ '+t; tags.appendChild(s); });\n  const actions = document.getElementById('card-actions');\n  actions.innerHTML='';\n  // Everyone has a 1-on-1 dialog — even Benden (self-monologue).\n  const talk = document.createElement('button');\n  talk.className='card-btn'; talk.type='button';\n  talk.textContent = (emp.name === 'BENDEN') ? '💭 內心 OS' : '💬 1-on-1 對話';\n  talk.addEventListener('click', () => {\n    cardOverlay.classList.remove('active');\n    openRpg(emp);\n  });\n  actions.appendChild(talk);\n  // Benden also gets a direct entry to the AI debate room (preserved).\n  if (emp.name === 'BENDEN') {\n    const a = document.createElement('a');\n    a.className='card-btn'; a.href=FEATURES.debate.url; a.textContent='💬 進入 AI 辯論室';\n    actions.appendChild(a);\n  }\n  cardOverlay.classList.add('active');\n}\ndocument.getElementById('card-close').addEventListener('click', ()=>cardOverlay.classList.remove('active'));\ncardOverlay.addEventListener('click', e => { if (e.target === cardOverlay) cardOverlay.classList.remove('active'); });\n\n// ── meeting room (topic input) ──\nconst meetingOverlay = document.getElementById('meeting-overlay');\nfunction openMeeting() {\n  document.getElementById('meeting-topic').value = '';\n  meetingOverlay.classList.add('active');\n  setTimeout(() => document.getElementById('meeting-topic').focus(), 50);\n}\nfunction closeMeeting() { meetingOverlay.classList.remove('active'); }\ndocument.getElementById('meeting-close').addEventListener('click', closeMeeting);\nmeetingOverlay.addEventListener('click', e => { if (e.target === meetingOverlay) closeMeeting(); });\n\ndocument.getElementById('meeting-start').addEventListener('click', () => {\n  const topic = document.getElementById('meeting-topic').value.trim();\n  if (!topic) { document.getElementById('meeting-topic').focus(); return; }\n  const route = routeTopic(topic);\n  // Build participant list: keep the lead order, while always inviting the\n  // full AI office roster (including all original members).\n  const prioritized = new Set([route.lead, ...route.collab].filter(Boolean));\n  const everyone = EMPLOYEES\n    .map(e => e.name)\n    .filter(n => n !== 'BENDEN' && !prioritized.has(n));\n  const order = ['BENDEN', route.lead, ...route.collab, ...everyone];\n  const seen = new Set();\n  const participants = [];\n  for (const n of order) {\n    if (!seen.has(n) && EMPLOYEES.some(e => e.name === n)) {\n      seen.add(n); participants.push(n);\n    }\n  }\n  // Walk participants to the meeting-room chairs. They keep meetingLock=true\n  // until the page is reloaded (we navigate away anyway).\n  participants.forEach((name, i) => {\n    const emp = EMPLOYEES.find(e => e.name === name);\n    if (!emp) return;\n    const chairs = getMeetingChairs();\n    const seat = chairs[i] || chairs[chairs.length-1];\n    emp.meetingLock = true;\n    emp.dx = seat.gx; emp.dy = seat.gy;\n    emp.destKind = 'meeting';\n    emp.state = 'WALKING';\n  });\n  closeMeeting();\n  // Give the eye ~1.2 s to register that people are heading over, then jump\n  // into the debate page with the topic + roles pre-filled.\n  const url = FEATURES.debate.url\n    + '?topic=' + encodeURIComponent(topic)\n    + '&roles=' + encodeURIComponent(participants.join(','));\n  setTimeout(() => { window.location.href = url; }, 1200);\n});\n\n// ── leisure dispatch overlay ──\nconst leisureOverlay = document.getElementById('leisure-overlay');\nconst LEISURE_META = {\n  coffee: {\n    title:'☕ 呼叫喝咖啡',\n    prompt:'點擊咖啡機後，選兩位員工去茶水間喝咖啡。',\n    button:'▶ 去喝咖啡',\n    spotKey:'pantry',\n    destKind:'pantry',\n  },\n  foosball: {\n    title:'⚽ 呼叫玩手足球',\n    prompt:'點擊手足球檯後，選兩位員工到球檯的兩側長邊對戰。',\n    button:'▶ 去玩手足球',\n    spotKey:'foosball',\n    destKind:'foosball',\n  },\n};\nconst LEISURE_PAIR_SIZE = 2;\nlet leisureActivity = 'coffee';\nlet leisureSelected = [];\n\nfunction availableLeisureEmployees() {\n  return EMPLOYEES.filter(emp => !emp.meetingLock);\n}\n\nfunction clearActivityStay(emp) {\n  // Manual leisure dispatch should replace any prior destination linger state.\n  emp.foosballStay = 0;\n  emp.pantryStay = 0;\n  emp.stayUntil = 0;\n}\n\nfunction leisureStatusText() {\n  const availableCount = availableLeisureEmployees().length;\n  if (availableCount < LEISURE_PAIR_SIZE) return `目前可呼叫人數不足 ${LEISURE_PAIR_SIZE} 位。`;\n  if (leisureSelected.length === 0) return `請選 ${LEISURE_PAIR_SIZE} 位員工。`;\n  const picked = leisureSelected.join('、');\n  if (leisureSelected.length === 1) return `已選：${picked}（再選 1 位）`;\n  return `已選：${picked}（準備出發）`;\n}\n\nfunction isLeisureChoiceLocked(isSelected) {\n  return !isSelected && leisureSelected.length >= LEISURE_PAIR_SIZE;\n}\n\nfunction leisureStayProp(activity) {\n  return activity === 'foosball' ? 'foosballStay' : 'pantryStay';\n}\n\nfunction leisureStayDuration(activity) {\n  return activity === 'foosball'\n    ? rndInt(ROUTINE.foosballStayMin, ROUTINE.foosballStayMax)\n    : rndInt(ROUTINE.stayAtDestMin, ROUTINE.stayAtDestMax);\n}\n\nfunction renderLeisurePicker() {\n  const meta = LEISURE_META[leisureActivity];\n  const employees = availableLeisureEmployees();\n  document.getElementById('leisure-title').textContent = meta.title;\n  document.getElementById('leisure-prompt').textContent = meta.prompt;\n  document.getElementById('leisure-status').textContent = leisureStatusText();\n  const startBtn = document.getElementById('leisure-start');\n  startBtn.textContent = meta.button;\n  startBtn.disabled = leisureSelected.length !== LEISURE_PAIR_SIZE;\n\n  const grid = document.getElementById('leisure-grid');\n  grid.innerHTML = '';\n  if (employees.length === 0) {\n    const empty = document.createElement('div');\n    empty.textContent = '目前沒有可呼叫的員工。';\n    empty.style.color = '#667799';\n    empty.style.fontSize = '6px';\n    empty.style.lineHeight = '1.9';\n    grid.appendChild(empty);\n  }\n  employees.forEach(emp => {\n    const btn = document.createElement('button');\n    btn.type = 'button';\n    const isSelected = leisureSelected.includes(emp.name);\n    btn.className = 'leisure-emp' + (isSelected ? ' active' : '');\n    btn.disabled = isLeisureChoiceLocked(isSelected);\n    btn.append(document.createTextNode(emp.name), document.createElement('br'), document.createTextNode(emp.roleZh));\n    btn.addEventListener('click', () => toggleLeisureEmployee(emp.name));\n    grid.appendChild(btn);\n  });\n}\n\nfunction openLeisure(activity) {\n  if (!LEISURE_META[activity]) return;\n  leisureActivity = activity;\n  leisureSelected = [];\n  renderLeisurePicker();\n  leisureOverlay.classList.add('active');\n}\n\nfunction closeLeisure() {\n  leisureOverlay.classList.remove('active');\n}\n\nfunction toggleLeisureEmployee(name) {\n  if (leisureSelected.includes(name)) {\n    leisureSelected = leisureSelected.filter(n => n !== name);\n  } else if (leisureSelected.length < LEISURE_PAIR_SIZE) {\n    leisureSelected = [...leisureSelected, name];\n  }\n  renderLeisurePicker();\n}\n\nfunction dispatchLeisurePair() {\n  if (leisureSelected.length !== LEISURE_PAIR_SIZE) return;\n  const meta = LEISURE_META[leisureActivity];\n  if (!meta) return;\n  const pair = leisureSelected\n    .map(name => EMPLOYEES.find(emp => emp.name === name))\n    .filter(Boolean);\n  if (pair.length !== LEISURE_PAIR_SIZE) return;\n  const spots = WANDER_SPOTS[meta.spotKey];\n  if (!spots || spots.length < LEISURE_PAIR_SIZE) return;\n  const stay = leisureStayDuration(leisureActivity);\n  const stayProp = leisureStayProp(leisureActivity);\n\n  pair.forEach((emp, idx) => {\n    clearActivityStay(emp);\n    emp[stayProp] = stay;\n    sendTo(emp, spots[idx].gx, spots[idx].gy, meta.destKind);\n  });\n\n  closeLeisure();\n}\n\ndocument.getElementById('leisure-close').addEventListener('click', closeLeisure);\nleisureOverlay.addEventListener('click', e => { if (e.target === leisureOverlay) closeLeisure(); });\ndocument.getElementById('leisure-start').addEventListener('click', dispatchLeisurePair);\n\n// ── RPG 1-on-1 dialog overlay ──\nconst rpgOverlay = document.getElementById('rpg-overlay');\nlet rpgScript = [];\nlet rpgIndex  = 0;\nlet rpgTyping = false;\nlet rpgFullText = '';\nlet rpgTimer = null;\nlet rpgLeftName = 'BENDEN';\n\nfunction drawBigAvatar(canvasEl, emp) {\n  const a = canvasEl.getContext('2d');\n  a.imageSmoothingEnabled = false;\n  a.clearRect(0, 0, 96, 96);\n  // Scaled-up version of drawCardAvatar (2x).\n  a.fillStyle = rgbStr(emp.hair); a.fillRect(20, 8, 56, 24);\n  a.fillStyle = rgbStr(emp.skin); a.fillRect(24, 24, 48, 40);\n  a.fillStyle = '#111';            a.fillRect(34, 38, 8, 8); a.fillRect(56, 38, 8, 8);\n  a.fillStyle = '#aa6655';         a.fillRect(40, 56, 16, 6);\n  a.fillStyle = rgbStr(emp.shirt); a.fillRect(16, 64, 64, 32);\n}\n\nfunction openRpg(emp) {\n  const script = EMP_DIALOGS[emp.name] || [\n    { who:'BENDEN', text:`嗨 ${emp.name}，最近怎麼樣？` },\n    { who:emp.name, text:'還行，就在處理手上的工作。' },\n    { who:'BENDEN', text:'有需要支援的隨時跟我說。' },\n  ];\n  rpgScript = script;\n  rpgIndex = 0;\n  // Portraits — Benden left, the other engineer right.\n  const benden = EMPLOYEES.find(e => e.name === 'BENDEN');\n  rpgLeftName = 'BENDEN';\n  drawBigAvatar(document.querySelector('#rpg-left  .rpg-face'), benden);\n  document.querySelector('#rpg-left  .rpg-pname').textContent = 'BENDEN';\n  drawBigAvatar(document.querySelector('#rpg-right .rpg-face'), emp);\n  document.querySelector('#rpg-right .rpg-pname').textContent = emp.name;\n  rpgOverlay.classList.add('active');\n  rpgShowLine();\n}\n\nfunction rpgShowLine() {\n  if (rpgIndex >= rpgScript.length) { closeRpg(); return; }\n  const line = rpgScript[rpgIndex];\n  const isLeft = (line.who === rpgLeftName);\n  const box = document.getElementById('rpg-box');\n  box.classList.toggle('speaker-left', isLeft);\n  box.classList.toggle('speaker-right', !isLeft);\n  document.getElementById('rpg-speaker').textContent = line.who;\n  rpgFullText = line.text;\n  const el = document.getElementById('rpg-text');\n  el.textContent = '';\n  rpgTyping = true;\n  let i = 0;\n  if (rpgTimer) clearInterval(rpgTimer);\n  rpgTimer = setInterval(() => {\n    i++;\n    el.textContent = rpgFullText.slice(0, i);\n    if (i >= rpgFullText.length) {\n      clearInterval(rpgTimer); rpgTimer = null; rpgTyping = false;\n    }\n  }, 35);\n}\n\nfunction rpgAdvance() {\n  if (rpgTyping) {\n    // Finish typing immediately on the first click.\n    if (rpgTimer) { clearInterval(rpgTimer); rpgTimer = null; }\n    document.getElementById('rpg-text').textContent = rpgFullText;\n    rpgTyping = false;\n    return;\n  }\n  rpgIndex++;\n  rpgShowLine();\n}\n\nfunction closeRpg() {\n  if (rpgTimer) { clearInterval(rpgTimer); rpgTimer = null; }\n  rpgTyping = false;\n  rpgOverlay.classList.remove('active');\n}\n\ndocument.getElementById('rpg-box').addEventListener('click', rpgAdvance);\n\ndocument.addEventListener('keydown', e => {\n  if (e.key === 'Escape') {\n    cardOverlay.classList.remove('active');\n    closeMeeting();\n    closeLeisure();\n    closeRpg();\n    return;\n  }\n  if (rpgOverlay.classList.contains('active') && (e.key === ' ' || e.key === 'Enter')) {\n    e.preventDefault();\n    rpgAdvance();\n  }\n});\n\n// ── build info ──\nconst ts = \"__BUILD_TS__\";\nconst bi = document.getElementById('buildInfo');\nif (bi && !ts.startsWith('__')) bi.textContent = 'BUILT ' + ts;\n\n// ════════════════════════════════════════════\n//  RESPONSIVE SCALE\n// ════════════════════════════════════════════\nfunction scaleStage() {\n  const wrapper = document.getElementById('stage-wrapper');\n  const stage = document.getElementById('stage');\n  const scale = Math.min(window.innerWidth / 900, 1);\n  stage.style.transform = `scale(${scale})`;\n  wrapper.style.width = Math.min(window.innerWidth, 900) + 'px';\n  wrapper.style.height = (560 * scale) + 'px';\n}\nscaleStage();\nwindow.addEventListener('resize', scaleStage);\n<\u002Fscript>\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
