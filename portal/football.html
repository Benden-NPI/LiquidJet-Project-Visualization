  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"zh-Hant\"><head>\n<meta charset=\"utf-8\">\n<title>LiquidJet · FIFA 2026 ⚽<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"description\" content=\"LiquidJet FIFA 2026 特別版：45° 等角像素足球場。\">\n<link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'&gt;&lt;path d='M32 6 L18 30 L46 30 Z' fill='%23ffffff'/&gt;&lt;path d='M14 30 L50 30 L57 50 L40 58 L22 56 L9 46 Z' fill='%237cc4ff'/&gt;&lt;/svg&gt;\">\n<style>\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4f360146-1771-4967-bb1f-7e98af79ab5b\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"90226ac9-b40b-477c-9848-2633e1962780\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"df53f5ac-b647-4dab-9a43-b6df99ce606f\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8d1f0dff-817a-455d-a71d-297cb4f70b1d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ad23ba01-657e-4d7d-8a9c-971263137ea0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n* { box-sizing:border-box; margin:0; padding:0; image-rendering:pixelated; }\nhtml, body { height:100%; }\nbody {\n  background:#071507;\n  color:#ccffcc;\n  font-family:'Press Start 2P', monospace;\n  display:flex; flex-direction:column; align-items:center;\n  min-height:100dvh; overflow-x:hidden;\n  padding:env(safe-area-inset-top,10px) 0 0;\n}\n\n/* scanlines */\nbody::before {\n  content:''; position:fixed; inset:0; z-index:998; pointer-events:none;\n  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.13) 2px,rgba(0,0,0,.13) 4px);\n}\n\n@keyframes blink { 50% { opacity:.55; } }\n\n#title {\n  color:#ffe066; font-size:11px; letter-spacing:2px; margin:6px 0 4px;\n  text-shadow:2px 2px #448800, 0 0 18px rgba(80,255,80,.4);\n  animation:blink 3s step-end infinite; text-align:center; flex-shrink:0;\n}\n#subtitle { color:#44cc44; font-size:6px; letter-spacing:2px; margin-bottom:8px; flex-shrink:0; }\n\n/* football field viewport */\n#stage-wrapper { position:relative; width:min(900px,100vw); flex-shrink:0; }\n#stage {\n  position:absolute; top:0; left:0; width:900px; height:560px;\n  background:#0d1a0d; border:4px solid #2a4a2a;\n  box-shadow:0 0 0 4px #071507, 0 0 40px #33aa3344;\n  overflow:hidden; transform-origin:top left;\n}\n#scene { position:absolute; inset:0; }\n\n#hint {\n  color:#3a6a3a; font-size:6px; margin-top:6px; text-align:center;\n  animation:blink 1.6s step-end infinite; flex-shrink:0; line-height:1.8;\n}\n\n/* legend */\n#legend {\n  display:flex; flex-wrap:wrap; gap:6px 10px; justify-content:center;\n  margin:10px auto 4px; max-width:760px; padding:0 12px; flex-shrink:0;\n}\n.leg { display:flex; align-items:center; gap:5px; font-size:5px; color:#5566aa; }\n.leg .sw { width:9px; height:9px; border:1px solid #000; }\n\n/* ── info card (employee) ── */\n#card-overlay {\n  position:fixed; inset:0; background:#00000099; z-index:200;\n  display:none; align-items:center; justify-content:center; padding:16px;\n}\n#card-overlay.active { display:flex; }\n#info-card {\n  width:min(360px,94vw); background:#0a0a2a;\n  border:4px solid #8888ff; box-shadow:inset 0 0 0 2px #000, 0 0 24px #4444ff55;\n  position:relative;\n}\n#card-head { background:#1a1a4a; border-bottom:3px solid #8888ff; padding:12px 14px; display:flex; gap:12px; align-items:center; }\n#card-avatar { width:48px; height:48px; image-rendering:pixelated; flex-shrink:0; border:2px solid #000; }\n#card-name { color:#ffe066; font-size:11px; text-shadow:1px 1px #996600; }\n#card-role { color:#88aaff; font-size:7px; margin-top:6px; line-height:1.6; }\n#card-body { padding:14px; }\n#card-desc { color:#aabbdd; font-size:6px; line-height:2.2; }\n#card-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }\n.card-tag { font-size:5px; padding:4px 7px; background:#050518; border:1px solid #2a2a5a; color:#5577bb; }\n#card-close {\n  position:absolute; top:8px; right:10px; background:none; border:2px solid #ff4444;\n  color:#ff4444; font-family:'Press Start 2P',monospace; font-size:7px; padding:3px 6px; cursor:pointer;\n}\n#card-close:hover { background:#ff444422; }\n#card-actions { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }\n.card-btn {\n  font-family:'Press Start 2P',monospace; font-size:6px; padding:8px 11px;\n  background:#1a1a4a; border:2px solid #8888ff; color:#ffe066; cursor:pointer;\n  text-decoration:none; box-shadow:2px 2px 0 #000;\n}\n.card-btn:hover { background:#2a2a6a; }\n\nfooter {\n  margin:14px auto 24px; display:flex; gap:18px; flex-wrap:wrap; justify-content:center;\n  font-size:5px; color:#1e2a4a; flex-shrink:0;\n}\nfooter a { color:inherit; text-decoration:none; }\nfooter a:hover { color:#4488ff; }\n\n/* ── meeting room (topic input) ── */\n#meeting- n}\n#leisure-close {\n  background:none; border:2px solid #66bbee; color:#88ddff;\n  font-family:'Press Start 2P',monospace; font-size:7px; padding:3px 6px; cursor:pointer;\n}\n#leisure-close:hover { background:#66bbee1a; }\n#leisure-body { padding:14px; display:flex; flex-direction:column; gap:12px; }\n#leisure-prompt, #leisure-status { font-size:6px; line-height:1.9; }\n#leisure-prompt { color:#ffe066; }\n#leisure-status { color:#88aaff; min-height:20px; }\n#leisure-grid {\n  display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px;\n}\n.leisure-emp {\n  font-family:'Press Start 2P',monospace; font-size:6px; line-height:1.8;\n  padding:8px; text-align:left; background:#050518; border:2px solid #2a2a5a;\n  color:#ccdfff; cursor:pointer; box-shadow:2px 2px 0 #000;\n}\n.leisure-emp:hover { background:#10203a; border-color:#66bbee; }\n.leisure-emp.active { background:#17304a; border-color:#88ccff; color:#ffe066; }\n.leisure-emp:disabled {\n  opacity:.45; cursor:not-allowed; background:#0d0d18; color:#667799;\n}\n#leisure-actions { display:flex; gap:8px; justify-content:flex-end; }\n\n/* ── RPG 1-on-1 dialog overlay ── */\n#rpg-overlay {\n  position:fixed; inset:0; z-index:220;\n  display:none; flex-direction:column; justify-content:flex-end;\n  background:#000;\n}\n#rpg-overlay.active { display:flex; }\n#rpg-bg {\n  position:absolute; inset:0;\n  background:\n    repeating-linear-gradient(0deg, #181830 0 16px, #14142a 16px 32px),\n    radial-gradient(ellipse at center, #2a1a3a 0%, #0a0a1a 70%);\n  background-blend-mode: multiply;\n}\n#rpg-bg::after {\n  content:''; position:absolute; inset:0;\n  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.18) 2px,rgba(0,0,0,.18) 4px);\n  pointer-events:none;\n}\n#rpg-portraits {\n  position:absolute; left:0; right:0; bottom:200px;\n  display:flex; justify-content:space-between; padding:0 8vw; pointer-events:none;\n}\n.rpg-portrait { display:flex; flex-direction:column; align-items:center; gap:8px; }\n.rpg-face {\n  width:160px; height:160px; image-rendering:pixelated;\n  background:#0a0a1a; border:4px solid #8888ff;\n  box-shadow:inset 0 0 0 2px #000, 0 0 16px #4444ff66;\n}\n#rpg-right .rpg-face { border-color:#ff8866; box-shadow:inset 0 0 0 2px #000, 0 0 16px #ff664466; }\n.rpg-pname {\n  font-family:'Press Start 2P',monospace; font-size:10px;\n  color:#ffe066; text-shadow:1px 1px #996600; padding:4px 8px;\n  background:#0a0a1a; border:2px solid #8888ff;\n}\n#rpg-right .rpg-pname { border-color:#ff8866; }\n#rpg-box {\n  position:relative; z-index:2; margin:0 4vw 24px;\n  background:#0a0a2a; border:4px solid #ffffff;\n  box-shadow:inset 0 0 0 2px #000, 0 0 24px #4444ff66;\n  padding:18px 22px; min-height:140px; cursor:pointer;\n  display:flex; flex-direction:column; align-items:flex-start;\n}\n#rpg-speaker {\n  display:inline-block;\n  font-family:'Press Start 2P',monospace; font-size:10px;\n  color:#ffe066; text-shadow:1px 1px #996600;\n  background:#1a1a4a; border:2px solid #8888ff;\n  padding:4px 10px; margin-bottom:10px;\n}\n#rpg-text {\n  font-family:'Press Start 2P',monospace; font-size:11px;\n  color:#ffffff; line-height:2.0; min-height:64px;\n  text-shadow:1px 1px #000; width:100%;\n}\n/* left speaker: label + text hug the left edge */\n#rpg-box.speaker-left { align-items:flex-start; }\n#rpg-box.speaker-left #rpg-speaker { border-color:#8888ff; }\n#rpg-box.speaker-left #rpg-text { text-align:left; }\n/* right speaker: label + text hug the right edge */\n#rpg-box.speaker-right { align-items:flex-end; }\n#rpg-box.speaker-right #rpg-speaker { border-color:#ff8866; }\n#rpg-box.speaker-right #rpg-text { text-align:right; }\n#rpg-hint {\n  position:absolute; right:14px; bottom:8px;\n  font-family:'Press Start 2P',monospace; font-size:5px; color:#88aacc;\n  animation:blink 1.2s step-end infinite;\n}\n#ctrlbar {\n  display:flex; gap:10px; align-items:center; justify-content:center;\n  margin:8px auto 0; flex-wrap:wrap; flex-shrink:0; padding:0 12px;\n}\n#ctrl-toggle {\n  font-family:'Press Start 2P',monospace; font-size:7px; padding:7px 10px;\n  background:#102a18; border:2px solid #2aa84a; color:#9fe6b0; cursor:pointer;\n  box-shadow:2px 2px 0 #000;\n}\n#ctrl-toggle.on { background:#1d5a2e; border-color:#5cff8a; color:#eafff0; }\n#ctrl-toggle:hover { background:#184a26; }\n#ctrl-help { font-size:6px; color:#6fae7f; line-height:1.7; text-align:center; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"title\">⚽ LIQUIDJET × FIFA 2026 ⚽<\u002Fdiv>\n<div id=\"subtitle\">45° ISOMETRIC · FOOTBALL EDITION · BENDEN NPI<\u002Fdiv>\n\n<div id=\"stage-wrapper\">\n  <div id=\"stage\">\n    <canvas id=\"scene\" width=\"900\" height=\"560\"><\u002Fcanvas>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"hint\">▼ 點球員看名片 · 點看板進功能 · ⚽ 十人對戰 · FIFA 2026 ▼<\u002Fdiv>\n\n<div id=\"ctrlbar\">\n  <button id=\"ctrl-toggle\" type=\"button\">🎮 控制球員：關<\u002Fbutton>\n  <span id=\"ctrl-help\"><\u002Fspan>\n<\u002Fdiv>\n\n<div id=\"legend\">\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#74acdf\"><\u002Fspan>ARG 隊（藍白條紋）<\u002Fspan>\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#d03333\"><\u002Fspan>ROJO 隊（紅衫）<\u002Fspan>\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#4466ff\"><\u002Fspan>🎨 廣告板 = PROJECT VIZ<\u002Fspan>\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#44cc88\"><\u002Fspan>📈 廣告板 = YIELD<\u002Fspan>\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#ffaa44\"><\u002Fspan>🛡️ 廣告板 = CONTROL PLAN<\u002Fspan>\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#66ddee\"><\u002Fspan>📐 廣告板 = FLATNESS SUMMARY<\u002Fspan>\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#ffcc66\"><\u002Fspan>📏 廣告板 = STRETCH<\u002Fspan>\n  <span class=\"leg\"><span class=\"sw\" style=\"background:#44cc44\"><\u002Fspan>🏠 <a href=\"index.html\" style=\"color:#44cc44\">回辦公室<\u002Fa><\u002Fspan>\n<\u002Fdiv>\n\n<!-- employee info card -->\n<div id=\"card-overlay\">\n  <div id=\"info-card\">\n    <div id=\"card-head\">\n      <canvas id=\"card-avatar\" width=\"48\" height=\"48\"><\u002Fcanvas>\n      <div>\n        <div id=\"card-name\">???<\u002Fdiv>\n        <div id=\"card-role\">???<\u002Fdiv>\n      <\u002Fdiv>\n      <button id=\"card-close\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"card-body\">\n      <div id=\"card-desc\"><\u002Fdiv>\n      <div id=\"card-tags\"><\u002Fdiv>\n      <div id=\"card-actions\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- meeting room: Benden enters a topic before the debate begins -->\n<div id=\"meeting-overlay\">\n  <div id=\"meeting-card\">\n    <div id=\"meeting-head\">\n      <span>💬 進入會議室<\u002Fspan>\n      <button id=\"meeting-close\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"meeting-body\">\n      <div id=\"meeting-prompt\">BENDEN：今天我們要討論什麼？<\u002Fdiv>\n      <textarea id=\"meeting-topic\" rows=\"3\" placeholder=\"例如：bonding 良率掉了 5%，原因是什麼？\"><\u002Ftextarea>\n      <div id=\"meeting-routing\">輸入後系統會自動指派相關工程師到會議桌。<\u002Fdiv>\n      <div id=\"meeting-actions\">\n        <button class=\"card-btn\" id=\"meeting-start\">▶ 開始會議<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- leisure dispatch: choose any two employees for coffee / foosball -->\n<div id=\"leisure-overlay\">\n  <div id=\"leisure-card\">\n    <div id=\"leisure-head\">\n      <span id=\"leisure-title\">☕ 休閒呼叫<\u002Fspan>\n      <button id=\"leisure-close\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"leisure-body\">\n      <div id=\"leisure-prompt\">請選兩位員工開始活動。<\u002Fdiv>\n      <div id=\"leisure-status\">尚未選擇。<\u002Fdiv>\n      <div id=\"leisure-grid\"><\u002Fdiv>\n      <div id=\"leisure-actions\">\n        <button class=\"card-btn\" id=\"leisure-start\" disabled=\"\">▶ 呼叫出發<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 1-on-1 RPG-style dialog overlay (FF/Pokémon textbox style) -->\n<div id=\"rpg-overlay\">\n  <div id=\"rpg-bg\"><\u002Fdiv>\n  <div id=\"rpg-portraits\">\n    <div class=\"rpg-portrait\" id=\"rpg-left\">\n      <canvas class=\"rpg-face\" width=\"96\" height=\"96\"><\u002Fcanvas>\n      <div class=\"rpg-pname\">BENDEN<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"rpg-portrait\" id=\"rpg-right\">\n      <canvas class=\"rpg-face\" width=\"96\" height=\"96\"><\u002Fcanvas>\n      <div class=\"rpg-pname\">???<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"rpg-box\">\n    <div id=\"rpg-speaker\">???<\u002Fdiv>\n    <div id=\"rpg-text\"><\u002Fdiv>\n    <div id=\"rpg-hint\">▶ 點對話框或按 SPACE 繼續 · ESC 離開<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n<footer>\n  <a href=\"https://github.com/Benden-NPI/LiquidJet-Project-Visualization\" target=\"_blank\" rel=\"noopener\">© BENDEN NPI · LIQUIDJET<\u002Fa>\n  <span id=\"buildInfo\">—<\u002Fspan>\n<\u002Ffooter>\n\n<script>\n// ════════════════════════════════════════════\n//  ISO HELPERS\n// ════════════════════════════════════════════\nconst canvas = document.getElementById('scene');\nconst ctx = canvas.getContext('2d');\nctx.imageSmoothingEnabled = false;\n\nconst W = 900, H = 560;\nconst TW2 = 32, TH2 = 16;        // half tile width / height\nconst GW = 12, GH = 8;           // floor grid size (gx 0..GW, gy 0..GH)\nconst ORX = 386, ORY = 160;      // screen origin for grid corner (0,0) — centred\nconst WALL_HEIGHT = 114;\n// ── Draggable furniture positions (persisted across sessions) ──────────────\n// Margin (grid units) kept between any furniture edge and the floor boundary.\nconst FURNITURE_BOUNDARY_MARGIN = 0;\n\n// Load + validate saved positions; fall back to defaults for any non-finite value.\nconst DRAG_POSITIONS = (() => {\n  const fin = (v, def) => (typeof v === 'number' && isFinite(v)) ? v : def;\n  let saved = {};\n  try { saved = JSON.parse(localStorage.getItem('liquidjet.furniture.v1') || '{}'); } catch(e){}\n  return {\n    coffee:   { gx: fin(saved.coffee?.gx,   0.45), gy: fin(saved.coffee?.gy,   5.08) },\n    meeting:  { gx: fin(saved.meeting?.gx,  4.5),  gy: fin(saved.meeting?.gy,  4.8)  },\n    foosball: { gx: fin(saved.foosball?.gx, 7.2),  gy: fin(saved.foosball?.gy, 5.3)  },\n  };\n})();\nfunction saveFurniture() {\n  localStorage.setItem('liquidjet.furniture.v1', JSON.stringify(DRAG_POSITIONS));\n}\n\n// gx/gy are live getters so all existing code reading FOOSBALL_TABLE.gx/gy\n// automatically reflects the current dragged position.\nconst FOOSBALL_TABLE = {\n  get gx() { return DRAG_POSITIONS.foosball.gx; },\n  get gy() { return DRAG_POSITIONS.foosball.gy; },\n  w: 1.4, d: 0.8, h: 18,\n};\nconst EMPLOYEE_DEPTH_OFFSET = 0.55;\n\nconst isoX = (gx, gy) => ORX + (gx - gy) * TW2;\nconst isoY = (gx, gy) => ORY + (gx + gy) * TH2;\n\nfunction poly(pts, fill, stroke, lw) {\n  ctx.beginPath();\n  ctx.moveTo(pts[0][0], pts[0][1]);\n  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);\n  ctx.closePath();\n  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }\n  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }\n}\n\n// draw an iso box. footprint (gx,gy)->(gx+w,gy+d), height h(px up).\n// returns screen bbox {x,y,w,h} for hit-testing.\nfunction drawBox(gx, gy, w, d, h, top, right, left, outline) {\n  const A = [isoX(gx, gy),       isoY(gx, gy)];\n  const B = [isoX(gx + w, gy),   isoY(gx + w, gy)];\n  const C = [isoX(gx + w, gy+d), isoY(gx + w, gy+d)];\n  const D = [isoX(gx, gy+d),     isoY(gx, gy+d)];\n  const At = [A[0], A[1]-h], Bt = [B[0], B[1]-h], Ct = [C[0], C[1]-h], Dt = [D[0], D[1]-h];\n  // right face (toward +gx)\n  poly([B, C, Ct, Bt], right, outline, outline?1:0);\n  // left face (toward +gy)\n  poly([D, C, Ct, Dt], left, outline, outline?1:0);\n  // top face\n  poly([At, Bt, Ct, Dt], top, outline, outline?1:0);\n  const xs = [A[0],B[0],C[0],D[0]], ys = [At[1],Bt[1],Ct[1],Dt[1],A[1],C[1]];\n  const minX = Math.min(...xs), maxX = Math.max(...xs);\n  const minY = Math.min(...ys), maxY = Math.max(A[1],B[1],C[1],D[1]);\n  return { x:minX, y:minY, w:maxX-minX, h:maxY-minY };\n}\n\nfunction shade(rgb, f) {\n  return `rgb(${Math.max(0,Math.round(rgb[0]*f))},${Math.max(0,Math.round(rgb[1]*f))},${Math.max(0,Math.round(rgb[2]*f))})`;\n}\nconst rgbStr = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;\n\n// ════════════════════════════════════════════\n//  DATA\n// ════════════════════════════════════════════\n// 9 workstation employees (excluding Benden). gx,gy = standing tile.\n// Layout: 4 columns × 2 rows along the back of the room — balances the\n// composition against the front-centred meeting room.\nconst EMPLOYEES = [\n  { name:'MORGAN', role:'Integration Eng.',     roleZh:'整合工程',     gx:0.7, gy:0.9, hair:[0x33,0x55,0xcc], skin:[0xff,0xcc,0x99], shirt:[0x74,0xac,0xdf],\n    desc:'統籌各製程模組之間的銜接，確保系統整合順暢。' },\n  { name:'EVAN',   role:'Failure Analysis Eng.', roleZh:'失效分析',     gx:2.7, gy:0.9, hair:[0x88,0x44,0x22], skin:[0xff,0xdd,0xaa], shirt:[0x74,0xac,0xdf],\n    desc:'追查不良根因，從失效現象逆推到製程與材料。' },\n  { name:'BRIAN',  role:'Bonding Process Eng.',  roleZh:'接合製程',     gx:4.7, gy:0.9, hair:[0x22,0x22,0x33], skin:[0xee,0xcc,0xbb], shirt:[0x74,0xac,0xdf],\n    desc:'負責 bonding 製程參數與良率，盯緊介面品質。' },\n  { name:'JACOB',  role:'Mechanical Eng.',       roleZh:'機構工程',     gx:6.7, gy:0.9, hair:[0x44,0x33,0x22], skin:[0xff,0xdd,0xbb], shirt:[0x74,0xac,0xdf],\n    desc:'設計治具與機構，讓設備與夾持穩定可靠。' },\n  // Front row is STAGGERED +1 column vs the back row, so each back-row\n  // employee falls into the gap between two front desks and stays visible\n  // instead of being hidden directly behind a front desk + laptop.\n  { name:'JOY',    role:'Etching Process Eng.',  roleZh:'蝕刻製程',     gx:1.7, gy:2.9, hair:[0x99,0x22,0x77], skin:[0xff,0xcc,0xaa], shirt:[0x74,0xac,0xdf],\n    desc:'掌控 etching 製程窗口與均勻度，雕琢每一條線路。' },\n  { name:'JASON',  role:'Test Eng.',             roleZh:'測試工程',     gx:3.7, gy:2.9, hair:[0x22,0x44,0x66], skin:[0xff,0xcc,0x99], shirt:[0x74,0xac,0xdf],\n    desc:'建立量測與測試流程，把資料變成可信的判斷。' },\n  { name:'MZ',     role:'Quality Eng.',          roleZh:'品質工程',     gx:5.7, gy:2.9, hair:[0x33,0x33,0x33], skin:[0xee,0xcc,0xbb], shirt:[0x74,0xac,0xdf],\n    desc:'守住品質底線，管控 CTQ、PFMEA 與反應計畫。' },\n  { name:'LISA',   role:'Planner',               roleZh:'生產規劃',     gx:7.7, gy:2.9, hair:[0xaa,0x66,0x22], skin:[0xff,0xdd,0xaa], shirt:[0x74,0xac,0xdf],\n    desc:'排程與資源規劃，讓 milestone 一個個準時落地。' },\n  // Risk — 5th column of the staggered FRONT row.\n  { name:'RISK',   role:'Risk Analysis Eng.',    roleZh:'風險分析',     gx:9.7, gy:2.9, hair:[0x55,0x44,0x88], skin:[0xf2,0xcf,0xa5], shirt:[0x74,0xac,0xdf],\n    desc:'辨識風險、分級衝擊與機率，提出可執行的緩解與監控方案。' },\n  // Benden — Project Lead — 5th column of the BACK row, aligned with the others.\n  // He only walks over to the meeting table when a debate is convened.\n  { name:'BENDEN', role:'Project Lead',          roleZh:'專案負責人',   gx:8.7, gy:0.9, hair:[0x22,0x22,0x22], skin:[0xff,0xcc,0x99], shirt:[0x74,0xac,0xdf],\n    desc:'LiquidJet 專案負責人，統籌全局、拍板決策。' },\n];\n\n// Per-employee \"home\" (seat) and runtime state for the wander AI.\n// homeX / homeY = original desk anchor (immutable).\n// cx / cy = live world-grid position (mutated by the routine each tick).\n// state: 'AT_DESK' | 'WALKING' | 'AT_DEST'\n// destKind: 'pantry' | 'foosball' | 'colleague' | 'meeting' | 'desk' | null\n// ── Two teams of five for the FIFA 2026 match ──\n// fx/fy = home formation tile.  CELESTE (A) attack → (+gx), ROJO (B) attack ← (-gx).\nconst FOOTBALL = {\n  // CELESTE — sky-blue & white stripes (Argentina kit). Defends LEFT goal.\n  MORGAN: { team:'A', frole:'GK',  fx:1.0,  fy:4.0 },\n  EVAN:   { team:'A', frole:'DEF', fx:3.3,  fy:2.4 },\n  BRIAN:  { team:'A', frole:'DEF', fx:3.3,  fy:5.6 },\n  JOY:    { team:'A', frole:'MID', fx:5.2,  fy:4.0 },\n  JASON:  { team:'A', frole:'FWD', fx:7.4,  fy:3.0 },\n  // ROJO — solid red shirts, white shorts. Defends RIGHT goal.\n  JACOB:  { team:'B', frole:'GK',  fx:11.0, fy:4.0 },\n  MZ:     { team:'B', frole:'DEF', fx:8.7,  fy:2.4 },\n  LISA:   { team:'B', frole:'DEF', fx:8.7,  fy:5.6 },\n  RISK:   { team:'B', frole:'MID', fx:6.8,  fy:4.0 },\n  BENDEN: { team:'B', frole:'FWD', fx:4.6,  fy:5.0 },\n};\nconst KITS = {\n  A:  { type:'stripes', c1:[0x74,0xac,0xdf], c2:[0xff,0xff,0xff], shorts:[0x23,0x33,0x5a] },\n  Agk:{ type:'solid',   c1:[0xf2,0xd8,0x3a], c2:[0xf2,0xd8,0x3a], shorts:[0x1c,0x1c,0x2a] },\n  B:  { type:'solid',   c1:[0xd0,0x33,0x33], c2:[0xff,0xff,0xff], shorts:[0xff,0xff,0xff] },\n  Bgk:{ type:'solid',   c1:[0x3a,0xc8,0x6a], c2:[0x3a,0xc8,0x6a], shorts:[0x14,0x2a,0x1c] },\n};\n\nEMPLOYEES.forEach((e, i) => {\n  const f = FOOTBALL[e.name] || { team:'A', frole:'MID', fx:6, fy:4 };\n  e.homeX = e.gx; e.homeY = e.gy;\n  e.team = f.team; e.frole = f.frole; e.fx = f.fx; e.fy = f.fy;\n  e.cx = f.fx; e.cy = f.fy;\n  e.face = f.team === 'A' ? 1 : -1;\n  e.moving = false;\n  e._gait = i * 1.7;                 // per-player gait phase offset\n  e.kit = (f.frole === 'GK') ? KITS[f.team + 'gk'] : KITS[f.team];\n});\n\n// interactive feature objects\nconst FEATURES = {\n  viz:    { label:'PROJECT VIZ',  color:'#4466ff', url:'https://benden-npi.github.io/LiquidJet-Project-Visualization/editor/', newTab:true,\n            desc:'Scope · Mindmaps · ADR · Canvas Editor' },\n  yield:  { label:'YIELD',        color:'#44cc88', url:'https://benden-npi.github.io/Yield/', newTab:true,\n            desc:'製程良率資料、分析與追蹤' },\n  cp:     { label:'CONTROL PLAN', color:'#ffaa44', url:'scope/control-plan.html', newTab:false,\n            desc:'CTQ · PFMEA · Milestones' },\n  flat:   { label:'Flatness', color:'#66ddee', url:'flatness-summary.html', newTab:false,\n            desc:'Cold-plate flatness 趨勢、Cpk 與 GR&R 摘要' },\n  stretch:{ label:'STRETCH',       color:'#ffcc66', url:'stretch-analysis.html', newTab:false,\n            desc:'Stretch goal · 衝刺指標 · 進度看板' },\n  debate: { label:'AI 辯論室',    color:'#ff44aa', url:'ai-debate.html', newTab:false,\n            desc:'多角色 AI 在會議室裡互相辯論並結論' },\n};\n\nlet time = 0;\nlet hotspots = [];     // rebuilt every frame: {bbox, kind, ref}\nlet hoverHot = null;\n\n// ════════════════════════════════════════════\n//  DRAW: FOOTBALL FIELD (FIFA 2026 特別版)\n// ════════════════════════════════════════════\nfunction drawFieldLine(gx1, gy1, gx2, gy2) {\n  ctx.strokeStyle = 'rgba(255,255,255,0.82)';\n  ctx.lineWidth = 1.5;\n  ctx.beginPath();\n  ctx.moveTo(isoX(gx1, gy1), isoY(gx1, gy1));\n  ctx.lineTo(isoX(gx2, gy2), isoY(gx2, gy2));\n  ctx.stroke();\n}\n\nfunction drawFootballField() {\n  // Alternating green stripes (columns of 2 grid units)\n  for (let gy = 0; gy < GH; gy++) {\n    for (let gx = 0; gx < GW; gx++) {\n      const A=[isoX(gx,gy),isoY(gx,gy)], B=[isoX(gx+1,gy),isoY(gx+1,gy)];\n      const C=[isoX(gx+1,gy+1),isoY(gx+1,gy+1)], D=[isoX(gx,gy+1),isoY(gx,gy+1)];\n      const stripe = Math.floor(gx / 2) % 2;\n      const base = stripe === 0 ? '#277038' : '#2d7a3e';\n      poly([A,B,C,D], base, '#246633', 1);\n    }\n  }\n\n  // ── White field markings ──\n  // Outer boundary (edges of the grid)\n  drawFieldLine(0,0, GW,0);   // top edge (gy=0)\n  drawFieldLine(0,0, 0,GH);   // left edge (gx=0)\n  drawFieldLine(GW,0, GW,GH); // right edge (gx=GW)\n  drawFieldLine(0,GH, GW,GH); // bottom edge (gy=GH)\n\n  // Halfway line (gx = 6)\n  drawFieldLine(6,0, 6,GH);\n\n  // Center circle (approximated with polygon — 30 segments balances\n  // smoothness with pixel-art style without overshooting)\n  const cr = 1.3, ccx = 6, ccy = 4; // radius, center-x, center-y in grid units\n  ctx.strokeStyle = 'rgba(255,255,255,0.82)';\n  ctx.lineWidth = 1.5;\n  ctx.beginPath();\n  for (let i = 0; i <= 30; i++) {\n    const ang = (i / 30) * Math.PI * 2;\n    const px = ccx + cr * Math.cos(ang);\n    const py = ccy + cr * Math.sin(ang);\n    if (i === 0) ctx.moveTo(isoX(px,py), isoY(px,py));\n    else         ctx.lineTo(isoX(px,py), isoY(px,py));\n  }\n  ctx.stroke();\n\n  // Center spot\n  ctx.fillStyle = 'rgba(255,255,255,0.9)';\n  const cSpot = [isoX(6,4), isoY(6,4)];\n  ctx.fillRect(cSpot[0]-2, cSpot[1]-2, 4, 4);\n\n  // Left penalty box (gx=0..2.5, gy=1.5..6.5)\n  drawFieldLine(0,1.5, 2.5,1.5);\n  drawFieldLine(2.5,1.5, 2.5,6.5);\n  drawFieldLine(2.5,6.5, 0,6.5);\n  // Left goal area (gx=0..1.3, gy=2.5..5.5)\n  drawFieldLine(0,2.5, 1.3,2.5);\n  drawFieldLine(1.3,2.5, 1.3,5.5);\n  drawFieldLine(1.3,5.5, 0,5.5);\n  // Left penalty spot\n  ctx.fillStyle = 'rgba(255,255,255,0.9)';\n  const lPenSpot = [isoX(1.9,4), isoY(1.9,4)];\n  ctx.fillRect(lPenSpot[0]-2, lPenSpot[1]-2, 4, 4);\n\n  // Right penalty box (gx=9.5..12, gy=1.5..6.5)\n  drawFieldLine(12,1.5, 9.5,1.5);\n  drawFieldLine(9.5,1.5, 9.5,6.5);\n  drawFieldLine(9.5,6.5, 12,6.5);\n  // Right goal area (gx=10.7..12, gy=2.5..5.5)\n  drawFieldLine(12,2.5, 10.7,2.5);\n  drawFieldLine(10.7,2.5, 10.7,5.5);\n  drawFieldLine(10.7,5.5, 12,5.5);\n  // Right penalty spot\n  const rPenSpot = [isoX(10.1,4), isoY(10.1,4)];\n  ctx.fillRect(rPenSpot[0]-2, rPenSpot[1]-2, 4, 4);\n\n  // (3D goal frames are drawn separately as depth-sorted ground objects.)\n\n  // Corner arcs — FIFA rules require a 1 m radius; ≈0.28 grid units here\n  const arcR = 0.28;\n  [[0,0],[GW,0],[0,GH],[GW,GH]].forEach(([cgx,cgy]) => {\n    const cx2 = cgx + (cgx===0?arcR:-arcR);\n    const cy2 = cgy + (cgy===0?arcR:-arcR);\n    const startAng = Math.atan2(isoY(cgx,cgy)-isoY(cx2,cy2), isoX(cgx,cgy)-isoX(cx2,cy2));\n    ctx.strokeStyle = 'rgba(255,255,255,0.75)';\n    ctx.lineWidth = 1.5;\n    ctx.beginPath();\n    for (let i=0;i<=8;i++) {\n      const a = (i/8)*Math.PI/2;\n      const px = cgx + arcR*Math.cos(a + startAng - Math.PI/4*(cgx===0?1:-1));\n      const py = cgy + arcR*Math.sin(a + startAng - Math.PI/4*(cgy===0?1:-1));\n      if(i===0) ctx.moveTo(isoX(px,py),isoY(px,py));\n      else       ctx.lineTo(isoX(px,py),isoY(px,py));\n    }\n    ctx.stroke();\n  });\n\n  // FIFA 2026 watermark on center circle\n  ctx.save();\n  ctx.globalAlpha = 0.22;\n  ctx.fillStyle = '#ffffff';\n  ctx.font = '7px \"Press Start 2P\"'; ctx.textAlign = 'center';\n  ctx.fillText('⚽ FIFA 2026', isoX(6,4), isoY(6,4) + 4);\n  ctx.restore();\n}\n\n// ════════════════════════════════════════════\n//  DRAW: STADIUM STANDS (replaces drawWalls)\n// ════════════════════════════════════════════\nfunction drawStadiumWalls() {\n  const wallH = WALL_HEIGHT;\n  const p1=[isoX(0,0),isoY(0,0)], p2=[isoX(GW,0),isoY(GW,0)];\n  const q1=[isoX(0,0),isoY(0,0)], q2=[isoX(0,GH),isoY(0,GH)];\n\n  // Back-left stand (along gy=0 sideline) — blue/royal section\n  poly([p1, p2, [p2[0],p2[1]-wallH], [p1[0],p1[1]-wallH]], '#10244e', '#0a1a3e', 1);\n  // Back-right stand (along gx=0 sideline) — dark green section\n  poly([q1, q2, [q2[0],q2[1]-wallH], [q1[0],q1[1]-wallH]], '#0e2e18', '#0a2012', 1);\n\n  // Crowd rows on back-left stand\n  // CROWD_COLS — mix of spectator jersey / clothing colours (red, blue, white,\n  // orange, green, pink, sky-blue, yellow) for a realistic packed-stand look.\n  const CROWD_COLS = ['#e03030','#3060d8','#eeeeee','#ff8800','#20c040','#cc2080','#3388ff','#ffe050'];\n  const rowH = 11;\n  const numRows = Math.floor(wallH / rowH);\n  for (let row = 0; row < numRows; row++) {\n    const rowBase = '#10244e';\n    // Interpolate left/right end coordinates at this row band\n    const rY = row / numRows;\n    const ly1 = p1[1] - wallH + row * rowH;\n    const ry1 = p2[1] - wallH + row * rowH;\n    const ly2 = ly1 + rowH - 1;\n    const ry2 = ry1 + rowH - 1;\n    // Alternating row band shade\n    const bandCol = row % 2 === 0 ? '#122a56' : '#0e2048';\n    poly([[p1[0],ly1],[p2[0],ry1],[p2[0],ry2],[p1[0],ly2]], bandCol, '#0a1a3e', 1);\n    // Crowd pixel \"heads\" (deterministic hash, 2px each)\n    const numSpots = 28;\n    for (let s = 0; s < numSpots; s++) {\n      const fx = (s + 0.5) / numSpots;\n      const hx = p1[0] + fx*(p2[0]-p1[0]);\n      const hy = ly1 + fx*(ry1-ly1) + rowH * 0.45;\n      // Deterministic pseudo-random colour per seat (XOR hash avoids visible\n      // horizontal stripes while remaining frame-stable — no Math.random).\n      const hash = ((row * 31 + s * 17) ^ (row * 7)) % CROWD_COLS.length;\n      ctx.fillStyle = CROWD_COLS[hash];\n      ctx.fillRect(Math.round(hx)-1, Math.round(hy)-2, 2, 3);\n    }\n  }\n\n  // Crowd rows on back-right stand\n  for (let row = 0; row < numRows; row++) {\n    const ly1 = q1[1] - wallH + row * rowH;\n    const ry1 = q2[1] - wallH + row * rowH;\n    const ly2 = ly1 + rowH - 1;\n    const ry2 = ry1 + rowH - 1;\n    const bandCol = row % 2 === 0 ? '#102a1a' : '#0e2416';\n    poly([[q1[0],ly1],[q2[0],ry1],[q2[0],ry2],[q1[0],ly2]], bandCol, '#0a1a10', 1);\n    const numSpots = 18;\n    for (let s = 0; s < numSpots; s++) {\n      const fx = (s + 0.5) / numSpots;\n      const hx = q1[0] + fx*(q2[0]-q1[0]);\n      const hy = ly1 + fx*(ry1-ly1) + rowH * 0.45;\n      const hash = ((row * 23 + s * 13) ^ (row * 11)) % CROWD_COLS.length;\n      ctx.fillStyle = CROWD_COLS[hash];\n      ctx.fillRect(Math.round(hx)-1, Math.round(hy)-2, 2, 3);\n    }\n  }\n\n  // Stadium floodlights along top of back-left stand — one centred over each\n  // of the four billboards (gx 1.7 / 3.7 / 5.7 / 7.7).\n  for (let i = 0; i < 4; i++) {\n    const lg = 1.7 + i*2;\n    const lp = [isoX(lg,0), isoY(lg,0)-wallH+10];\n    // Rotate the whole fixture so the bar runs parallel to the stand's top\n    // edge (same slope as the billboard top edges).\n    ctx.save();\n    ctx.translate(lp[0], lp[1]);\n    ctx.rotate(Math.atan2(TH2, TW2));\n    // Light housing\n    ctx.fillStyle = '#445566'; ctx.fillRect(-16, -4, 32, 4);\n    // Floodlight glow\n    ctx.fillStyle = '#ffffcc'; ctx.fillRect(-14, 0, 28, 6);\n    ctx.save(); ctx.shadowColor='#ffff88'; ctx.shadowBlur=24;\n    ctx.fillStyle = '#ffffcc'; ctx.fillRect(-14, 0, 28, 6); ctx.restore();\n    // Support beam\n    ctx.fillStyle = '#556677'; ctx.fillRect(-2, 6, 4, 10);\n    ctx.restore();\n  }\n}\n\n// ════════════════════════════════════════════\n//  DRAW: TALL SIDELINE BILLBOARD (FIFA 2026 廣告牌)\n//  Freestanding LED board at the field sideline (gy≈0 edge).\n//  Same call signature / return as the original drawWallPanelLeft.\n// ════════════════════════════════════════════\nfunction drawWallPanelLeft(gx, label, color, screenIco) {\n  const bW=1.8, bD=0.18, bH=96;\n  const bGx = gx - bW/2, bGy = 0.01;\n  const hovered = hoverHot && hoverHot.kind==='feature' && hoverHot.label===label;\n\n  // Board body (dark frame + inner face)\n  drawBox(bGx, bGy, bW, bD, bH,\n    '#0a1122',\n    hovered ? '#1a2a3a' : '#080e1a',\n    hovered ? '#1a3050' : '#0c1a2e',\n    hovered ? color : '#1a2a3a');\n\n  // Front face (left face of box = +gy side = viewer-facing)\n  const fGy = bGy + bD;\n  const fl = [isoX(bGx,    fGy), isoY(bGx,    fGy)];\n  const fr = [isoX(bGx+bW, fGy), isoY(bGx+bW, fGy)];\n  const ftl = [fl[0], fl[1]-bH];\n  const ftr = [fr[0], fr[1]-bH];\n\n  // LED screen fill (inset 3px)\n  const ins=3;\n  poly([\n    [fl[0]+ins, fl[1]-ins],\n    [fr[0]-ins, fr[1]-ins],\n    [ftr[0]-ins, ftr[1]+ins],\n    [ftl[0]+ins, ftl[1]+ins],\n  ], hovered ? '#001428' : '#000a1c', hovered ? color+'44' : '#002244');\n\n  // Content\n  const fcx = (fl[0]+fr[0])*0.5;\n  const topY = (ftl[1]+ftr[1])*0.5;\n  const botY = (fl[1]+fr[1])*0.5;\n  const midY = (topY+botY)*0.5;\n\n  const pulse = 0.82 + 0.18*Math.sin(time*0.07 + gx*0.5);\n  // Paint the text in the billboard FACE's own (sheared) coordinate space so\n  // the baseline runs parallel to the board's top edge instead of staying\n  // horizontal. x-axis follows the top edge (ftl→ftr); y-axis runs straight\n  // down the face.\n  const ang = Math.atan2(ftr[1]-ftl[1], ftr[0]-ftl[0]);\n  const faceLen = Math.hypot(ftr[0]-ftl[0], ftr[1]-ftl[1]);\n  const ca = Math.cos(ang), sa = Math.sin(ang);\n  const midX = faceLen/2;\n  ctx.save(); ctx.globalAlpha = pulse;\n  ctx.transform(ca, sa, 0, 1, ftl[0], ftl[1]);\n  ctx.textAlign='center'; ctx.textBaseline='middle';\n\n  // Top FIFA 2026 stripe\n  ctx.fillStyle = hovered ? '#ffe066' : '#aacc44';\n  ctx.font='4px \"Press Start 2P\"';\n  ctx.fillText('⚽ FIFA 2026', midX, bH*0.16);\n\n  // Main icon\n  ctx.font='13px \"Press Start 2P\"';\n  ctx.fillText(screenIco, midX, bH*0.46);\n\n  // Label\n  ctx.fillStyle = hovered ? '#ffe066' : color;\n  ctx.font='5px \"Press Start 2P\"';\n  ctx.fillText(label, midX, bH*0.62);\n\n  ctx.textBaseline='alphabetic';\n  ctx.restore();\n\n  // Animated LED strip along top edge of billboard (6 dots, one illuminated per cycle)\n  const ledStep = Math.floor(time / 8) % 6; // advance one dot every 8 frames ≈ 7.5 Hz\n  for (let li=0; li<6; li++) {\n    const lx = ftl[0] + (ftr[0]-ftl[0])*(li+0.5)/6;\n    const ly = ftl[1] + (ftr[1]-ftl[1])*(li+0.5)/6 + 3;\n    ctx.fillStyle = li===ledStep ? (hovered?'#ffe066':color) : '#0a1a22';\n    ctx.fillRect(lx-1, ly-1, 2, 2);\n  }\n\n  // Two support poles from board base\n  [[0.28],[0.72]].forEach(([fx]) => {\n    const px = fl[0]+(fr[0]-fl[0])*fx;\n    const py = fl[1]+(fr[1]-fl[1])*fx;\n    ctx.strokeStyle='#3a5060'; ctx.lineWidth=2.5;\n    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py+16); ctx.stroke();\n  });\n\n  const minX = Math.min(ftl[0],ftr[0],fl[0],fr[0]);\n  const maxX = Math.max(ftl[0],ftr[0],fl[0],fr[0]);\n  return { x:minX, y:Math.min(ftl[1],ftr[1]), w:maxX-minX, h:Math.max(fl[1],fr[1])-Math.min(ftl[1],ftr[1]) };\n}\n\n// ════════════════════════════════════════════\n//  DRAW: WORKSTATION (desk + monitor + chair)\n//  Drawn at the employee's HOME desk anchor. The character itself is\n//  drawn separately (drawEmployeeChar) because it may have walked off.\n// ════════════════════════════════════════════\nfunction drawWorkstation(emp) {\n  const gx = emp.homeX, gy = emp.homeY;\n  const deskH = 26;\n  drawBox(gx-0.08, gy-0.94, 1.25, 0.72, deskH, '#6a4824','#4a3018','#5a3d1e','#2a1c0e');\n\n  // Laptop — sits ON the desk top surface. The lid IS the screen (monitor).\n  // The desk top is `deskH` px above the floor, so every part of the laptop is\n  // anchored to that surface (isoY - deskH) rather than the floor.\n  const lpW=0.66, lpD=0.40, lpH=4;\n  const lpGx=gx+0.50, lpGy=gy-0.60;                 // centred on the desktop\n  const bx0=lpGx-lpW/2, by0=lpGy-lpD/2, bx1=lpGx+lpW/2, by1=lpGy+lpD/2;\n\n  // Base slab — bottom rests on the desk top (isoY - deskH), top is lpH above it\n  const bA=[isoX(bx0,by0),isoY(bx0,by0)-deskH], bB=[isoX(bx1,by0),isoY(bx1,by0)-deskH],\n        bC=[isoX(bx1,by1),isoY(bx1,by1)-deskH], bD=[isoX(bx0,by1),isoY(bx0,by1)-deskH];\n  const bAt=[bA[0],bA[1]-lpH], bBt=[bB[0],bB[1]-lpH], bCt=[bC[0],bC[1]-lpH], bDt=[bD[0],bD[1]-lpH];\n  poly([bB,bC,bCt,bBt], '#161616');     // right face (+gx)\n  poly([bD,bC,bCt,bDt], '#242424');     // front face (+gy, toward viewer)\n  poly([bAt,bBt,bCt,bDt], '#2e2e2e');   // top face — the keyboard deck\n\n  // Keyboard hint — inset rectangle on the front portion of the deck top\n  const lerp=(p,q,t)=>[p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];\n  const deckPt=(u,v)=>lerp(lerp(bAt,bBt,u), lerp(bDt,bCt,u), v);\n  poly([deckPt(0.12,0.40), deckPt(0.88,0.40), deckPt(0.88,0.90), deckPt(0.12,0.90)], '#0e0e0e');\n  // Touchpad — small lighter strip at the very front of the deck\n  ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1;\n  ctx.beginPath();\n  ctx.moveTo(deckPt(0.38,0.78)[0], deckPt(0.38,0.78)[1]);\n  ctx.lineTo(deckPt(0.62,0.78)[0], deckPt(0.62,0.78)[1]);\n  ctx.stroke();\n\n  // Screen lid — hinged along the BACK edge of the deck (bAt→bBt), rising up\n  const hL=bAt, hR=bBt;\n  const lidH=19;\n  const tilt=3;  // slight back-tilt so the lid isn't perfectly vertical\n  const tL=[hL[0]+tilt, hL[1]-lidH];\n  const tR=[hR[0]+tilt, hR[1]-lidH];\n  // Lid frame — clearly attached to the deck's hinge edge\n  poly([hL, hR, tR, tL], '#1c1c1c', '#080808', 1);\n  // Hinge strip — visible bar where lid meets the deck\n  ctx.strokeStyle='#444'; ctx.lineWidth=1;\n  ctx.beginPath(); ctx.moveTo(hL[0], hL[1]); ctx.lineTo(hR[0], hR[1]); ctx.stroke();\n  // Camera dot at top of lid\n  const notch=[(tL[0]+tR[0])/2, (tL[1]+tR[1])/2+1];\n  ctx.fillStyle='#444'; ctx.fillRect(notch[0]-1, notch[1], 2, 1);\n  // Screen surface (inset from bezel — this IS the display)\n  const sc=[[hL[0]+2,hL[1]-2],[hR[0]-2,hR[1]-2],[tR[0]-2,tR[1]+3],[tL[0]+2,tL[1]+3]];\n  poly(sc, '#020a02');\n\n  // Matrix rain — clipped to screen polygon\n  ctx.save();\n  ctx.beginPath();\n  ctx.moveTo(sc[0][0], sc[0][1]);\n  sc.forEach(p=>ctx.lineTo(p[0],p[1]));\n  ctx.closePath();\n  ctx.clip();\n  const scLeft=Math.min(sc[0][0],sc[3][0])+1;\n  const scTop=Math.min(sc[2][1],sc[3][1])+1;\n  const scRight=Math.max(sc[1][0],sc[2][0])-1;\n  const scBot=Math.max(sc[0][1],sc[1][1])-1;\n  const scW=scRight-scLeft, scH=Math.max(1,scBot-scTop);\n  const rainCols=6;\n  const rColW=Math.max(2, Math.floor(scW/rainCols));\n  for(let c=0;c<rainCols;c++){\n    const rx=scLeft+c*rColW;\n    const speed=0.16+(c*0.05+gx*0.03)%0.15;\n    const headY=((time*speed+c*9+gx*5)%(scH+6))-4;\n    for(let t=0;t<7;t++){\n      const dy=headY-t*3;\n      if(dy<0||dy>scH) continue;\n      const alpha=Math.max(0,1-t/6);\n      const bright=Math.floor(180*alpha);\n      ctx.fillStyle=`rgba(0,${bright},${Math.floor(bright*0.25)},${alpha.toFixed(2)})`;\n      ctx.fillRect(rx, scTop+dy, rColW-1, 2);\n    }\n    if(headY>=0&&headY<=scH){ctx.fillStyle='#aaffbb';ctx.fillRect(rx,scTop+headY,rColW-1,2);}\n  }\n  ctx.restore();\n\n  // Power LED on the front face of the base (blinks green)\n  const fm=lerp(bD, bC, 0.5);\n  ctx.fillStyle=Math.floor(time/30)%2?'#00ff88':'#00aa55';\n  ctx.fillRect(fm[0]-1, fm[1]-2, 2, 2);\n\n  // Chair\n  drawBox(gx+0.11, gy+0.22, 0.62, 0.62, 12, '#33334a','#22223a','#2a2a42');\n}\n\n// Draw the employee's character at their CURRENT world tile (emp.cx/cy).\n// Returns the screen bbox used for click hit-testing.\nfunction drawEmployeeChar(emp) {\n  const gx = emp.cx, gy = emp.cy;\n  const cx = isoX(gx+0.4, gy+0.6), cy = isoY(gx+0.4, gy+0.6);\n  const bbox = drawChar(cx, cy, emp, !emp.moving);\n  drawNameplate(cx, cy, emp, emp.name === 'BENDEN' ? '#ffe066' : undefined);\n  if (emp === controlled) drawControlMarker(cx, cy);\n  return bbox;\n}\n\n// Tiny pixel speech bubble — drawn just above the nameplate.\nfunction drawChatBubble(cx, cy, text) {\n  cx = Math.round(cx);\n  const baseY = Math.round(cy) - 76;             // sits just above nameplate\n  const bob = Math.sin(time*0.08 + cx)*1;        // subtle float\n  const w = Math.max(26, text.length * 7 + 10);\n  const h = 12;\n  const x = cx - w/2, y = baseY + bob;\n  // bubble body\n  ctx.fillStyle = '#ffffff';\n  ctx.fillRect(x, y, w, h);\n  ctx.strokeStyle = '#222'; ctx.lineWidth = 1;\n  ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);\n  // little tail pointing down at the character\n  ctx.fillStyle = '#ffffff';\n  ctx.fillRect(cx-2, y+h, 4, 2);\n  ctx.fillRect(cx-1, y+h+2, 2, 2);\n  ctx.fillStyle = '#222';\n  ctx.fillRect(cx-3, y+h, 1, 1);\n  ctx.fillRect(cx+2, y+h, 1, 1);\n  // text\n  ctx.fillStyle = '#222';\n  ctx.font = '5px \"Press Start 2P\"';\n  ctx.textAlign = 'center';\n  ctx.fillText(text, cx, y + 8);\n}\n\n// ════════════════════════════════════════════\n//  DRAW: MEETING TABLE (AI Debate) + empty chairs\n//  Meeting room stays empty by default — employees walk over only when\n//  a debate is convened.\n// ════════════════════════════════════════════\nfunction drawMeetingChair(cgx, cgy, facing) {\n  // Dark slate office chair — deliberately a cool blue-grey so it reads\n  // clearly against the warm pink meeting table. `facing` points TOWARD the\n  // table, so the backrest is drawn on the OPPOSITE (outer) side of the seat.\n  const sw=0.46, sd=0.46, sh=9;\n  // Seat cushion\n  drawBox(cgx, cgy, sw, sd, sh, '#3c3c56','#22223a','#2e2e48','#14141e');\n  // Backrest — thin tall slab on the outer side of the seat\n  const brT=0.10, brH=17;\n  let bX=cgx, bY=cgy, bW=sw, bD=sd;\n  if (facing === 'right')      { bW = brT; }                       // back on LEFT\n  else if (facing === 'left')  { bX = cgx + sw - brT; bW = brT; }  // back on RIGHT\n  else if (facing === 'back')  { bY = cgy + sd - brT; bD = brT; }  // back at FRONT\n  else /* 'front' */           { bD = brT; }                       // back at BACK\n  drawBox(bX, bY, bW, bD, sh + brH, '#4a4a68','#26263c','#383852','#14141e');\n}\n\nfunction drawMeetingTable() {\n  const f = FEATURES.debate;\n  const hovered = hoverHot && hoverHot.kind==='feature' && hoverHot.label===f.label;\n  const gx = DRAG_POSITIONS.meeting.gx, gy = DRAG_POSITIONS.meeting.gy, w=2.4, d=1.6;\n  // Chairs around the table (always empty). Each entry is [cgx, cgy, facing]\n  // where `facing` points toward the table so the backrest renders on the\n  // outside of the seat.\n  const chairSpots = [\n    [gx-0.6,  gy+0.30, 'right'],\n    [gx-0.6,  gy+0.95, 'right'],\n    [gx+w+0.05, gy+0.30, 'left'],\n    [gx+w+0.05, gy+0.95, 'left'],\n    [gx+0.55, gy+d+0.10, 'back'],\n    [gx+1.35, gy+d+0.10, 'back'],\n  ];\n  chairSpots.forEach(([cgx,cgy,facing]) => drawMeetingChair(cgx, cgy, facing));\n  // table\n  const box = drawBox(gx, gy, w, d, 30,\n    hovered ? '#ff66bb' : '#7a3a5a',\n    hovered ? '#aa3070' : '#4a2036',\n    hovered ? '#cc4488' : '#5a2842',\n    hovered ? '#ffaadd' : '#2a1020');\n  // table-top label\n  const tc = [isoX(gx+w/2, gy+d/2), isoY(gx+w/2, gy+d/2) - 30];\n  ctx.textAlign='center';\n  ctx.font='14px \"Press Start 2P\"'; ctx.fillText('💬', tc[0], tc[1]-2);\n  ctx.fillStyle = hovered ? '#ffe066' : '#ffccee';\n  ctx.font='5px \"Press Start 2P\"'; ctx.fillText('AI 辯論', tc[0], tc[1]+12);\n  return box;\n}\n\n// ════════════════════════════════════════════\n//  DRAW: PANTRY (茶水間) — small table + water dispenser\n//  A relaxed corner where AI characters chitchat around the water dispenser.\n//  Floor-standing water dispenser with pixel-art design: one grid square base.\n// ════════════════════════════════════════════\nfunction drawPantry() {\n  const gx = DRAG_POSITIONS.coffee.gx, gy = DRAG_POSITIONS.coffee.gy;\n  const hovered = hoverHot && hoverHot.kind === 'leisure' && hoverHot.ref === 'coffee';\n\n  // 賀眾牌 slim floor-standing water cooler (0.50×0.50 footprint)\n  const W = 0.50, D = 0.50;\n  const bgx = gx - 0.25, bgy = gy - 0.25;\n\n  // Lower storage cabinet (silver-grey)\n  const loH = 24;\n  drawBox(bgx, bgy, W, D, loH,\n    hovered ? '#d4dce2' : '#bcc8d0',\n    hovered ? '#8898a8' : '#788898',\n    hovered ? '#98a8b8' : '#8898a8',\n    '#182028');\n\n  // Upper dispenser body — slightly inset, white-grey, taller\n  const hiH = 30;\n  const totH = loH + hiH;\n  drawBox(bgx+0.05, bgy+0.05, W-0.10, D-0.10, totH,\n    hovered ? '#f0f6fa' : '#dceaf2',\n    hovered ? '#b0c8dc' : '#a0b8cc',\n    hovered ? '#c4d8ec' : '#b4c8dc',\n    '#182028');\n\n  // Front face midpoint (centred on visible +gy face)\n  const fL=[isoX(bgx,   bgy+D), isoY(bgx,   bgy+D)];\n  const fR=[isoX(bgx+W, bgy+D), isoY(bgx+W, bgy+D)];\n  const fx=(fL[0]+fR[0])/2;\n  const fby=(fL[1]+fR[1])/2;\n\n  // Tap faceplate\n  const tapY=fby-loH-6;\n  ctx.fillStyle=hovered?'#3a5060':'#28404e';\n  ctx.fillRect(fx-11, tapY, 22, 12);\n\n  // Hot tap + LED\n  ctx.fillStyle=hovered?'#ff6050':'#cc3322';\n  ctx.fillRect(fx-9, tapY+3, 7, 7);\n  ctx.fillStyle=(Math.floor(time/42)%2)?'#ff3300':'#770000';\n  ctx.fillRect(fx-8, tapY+1, 2, 2);\n\n  // Cold tap + LED\n  ctx.fillStyle=hovered?'#4499ff':'#2255cc';\n  ctx.fillRect(fx+2, tapY+3, 7, 7);\n  ctx.fillStyle='#33aaff';\n  ctx.fillRect(fx+3, tapY+1, 2, 2);\n\n  // Drip tray + shimmer\n  ctx.fillStyle='#3a4a58'; ctx.fillRect(fx-12, tapY+12, 24, 3);\n  ctx.fillStyle='#88ccee'; ctx.fillRect(fx-1,  tapY+13, 2,  2);\n\n  // Cup well\n  ctx.fillStyle='#0e1c26'; ctx.fillRect(fx-8, tapY+15, 16, 5);\n\n  // Inverted 5-gallon bottle — anchored to the BODY TOP centre (not the front\n  // face) so it sits squarely on the cooler instead of drifting to one side.\n  const bcx=isoX(bgx+W/2, bgy+D/2);\n  const bottleBaseY=isoY(bgx+W/2, bgy+D/2)-totH;\n  const shimmer=Math.floor(148+Math.sin(time*0.024)*24);\n  // Neck collar (where bottle meets the dispenser)\n  ctx.fillStyle='#cfd8de'; ctx.fillRect(bcx-7, bottleBaseY-2, 14, 4);\n  // Barrel (translucent blue)\n  ctx.fillStyle=`rgba(32,88,${shimmer},0.82)`;\n  ctx.fillRect(bcx-9, bottleBaseY-19, 18, 18);\n  ctx.fillStyle='rgba(170,225,255,0.32)';\n  ctx.fillRect(bcx-7, bottleBaseY-17, 5, 13);\n  ctx.fillStyle='rgba(255,255,255,0.26)';\n  ctx.fillRect(bcx-8, bottleBaseY-13, 16, 5);\n  ctx.fillStyle='rgba(0,50,110,0.65)';\n  ctx.fillRect(bcx-2, bottleBaseY-12, 4, 3);\n  // Inverted neck (tapers down into the cooler)\n  ctx.fillStyle='rgba(38,96,180,0.88)';\n  ctx.fillRect(bcx-4, bottleBaseY-1, 8, 5);\n  // Cap dome at the very top + highlight\n  ctx.fillStyle='#e4f0f8'; ctx.fillRect(bcx-5, bottleBaseY-22, 10, 4);\n  ctx.fillStyle='#ffffff'; ctx.fillRect(bcx-4, bottleBaseY-22, 3,  2);\n\n  const hitY=bottleBaseY-23;\n  return { x:fL[0]-4, y:hitY, w:fR[0]-fL[0]+8, h:fby-hitY+4 };\n}\n\n// ════════════════════════════════════════════\n//  DRAW: FOOSBALL TABLE (手足球檯) — AI 放鬆區\n//  Lives in the front-RIGHT corner so it doesn't collide with the\n//  meeting-room chair on the left side of the meeting table.\n// ════════════════════════════════════════════\nfunction drawFoosball() {\n  const { gx, gy, w, d, h } = FOOSBALL_TABLE;\n  const hovered = hoverHot && hoverHot.kind === 'leisure' && hoverHot.ref === 'foosball';\n  // green playfield body\n  const tableBox = drawBox(gx, gy, w, d, h,\n    hovered ? '#44c968' : '#2aa84a',\n    hovered ? '#1f9750' : '#117733',\n    hovered ? '#27a95b' : '#198840',\n    hovered ? '#ffe066' : '#001a08');\n  // small legs hint (just darker boxes underneath the corners)\n  drawBox(gx, gy, 0.15, 0.15, h, '#222', '#111', '#1a1a1a');\n  drawBox(gx+w-0.15, gy+d-0.15, 0.15, 0.15, h, '#222', '#111', '#1a1a1a');\n  // rods + players (drawn on top face)\n  const tl = [isoX(gx, gy), isoY(gx, gy) - h];\n  const tr = [isoX(gx+w, gy), isoY(gx+w, gy) - h];\n  const bl = [isoX(gx, gy+d), isoY(gx, gy+d) - h];\n  // 4 rods crossing the field — interpolate along the top face\n  for (let i = 1; i <= 4; i++) {\n    const t = i / 5;\n    const a = [tl[0] + (tr[0]-tl[0])*t, tl[1] + (tr[1]-tl[1])*t];\n    const b = [bl[0] + (tr[0]-tl[0])*t, bl[1] + (tr[1]-tl[1])*t];\n    ctx.strokeStyle = '#dddddd'; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();\n    // 3 player figurines per rod\n    ctx.fillStyle = (i % 2 === 0) ? '#ff4444' : '#3366ff';\n    for (let k = 1; k <= 3; k++) {\n      const u = k / 4;\n      const px = a[0] + (b[0]-a[0])*u;\n      const py = a[1] + (b[1]-a[1])*u;\n      ctx.fillRect(px-2, py-3, 4, 5);\n    }\n  }\n  // ball (animated bouncing left/right)\n  const ballT = (Math.sin(time*0.05) + 1) / 2;\n  const bx = tl[0] + (tr[0]-tl[0]) * (0.2 + 0.6*ballT) + (bl[0]-tl[0]) * 0.5;\n  const by = tl[1] + (tr[1]-tl[1]) * (0.2 + 0.6*ballT) + (bl[1]-tl[1]) * 0.5;\n  ctx.fillStyle = '#ffffaa'; ctx.fillRect(bx-1, by-1, 2, 2);\n  // signage\n  const tc = [isoX(gx+w/2, gy+d+0.05), isoY(gx+w/2, gy+d+0.05) + 6];\n  ctx.textAlign='center';\n  ctx.fillStyle = hovered ? '#ffe066' : '#88ff99'; ctx.font = '5px \"Press Start 2P\"';\n  ctx.fillText('⚽ FOOSBALL · 手足球', tc[0], tc[1]);\n  return tableBox;\n}\n\n// ════════════════════════════════════════════\n//  DRAW: PIXEL CHARACTER\n// ════════════════════════════════════════════\nfunction drawChar(cx, cy, emp, idle) {\n  cx = Math.round(cx); cy = Math.round(cy);\n  const kit = emp.kit || { type:'stripes', c1:emp.shirt, c2:[255,255,255], shorts:[0x33,0x33,0x4a] };\n  const moving = !idle;\n  const gait = time*0.42 + (emp._gait||0);\n  const stride = moving ? Math.sin(gait) : 0;\n  const bob = moving ? Math.abs(Math.sin(gait))*1.6 : Math.sin(time*0.05 + cx)*1.2;\n  const py = Math.round(cy - bob);\n  const fc = (emp.face!=null ? emp.face : 1);\n  const sw = Math.round(stride * 3);   // leg scissor\n  const aSw = Math.round(stride * 2);  // arm swing\n  // shadow\n  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath();\n  ctx.ellipse(cx, cy+4, 12, 5, 0, 0, Math.PI*2); ctx.fill();\n  // legs (scissor stride) + bare shins + boots\n  const shorts = rgbStr(kit.shorts);\n  ctx.fillStyle=shorts;            ctx.fillRect(cx-6+sw, py-12, 4, 7);\n  ctx.fillStyle=rgbStr(emp.skin);  ctx.fillRect(cx-6+sw, py-5,  4, 4);\n  ctx.fillStyle='#1a1a1a';         ctx.fillRect(cx-7+sw, py-2,  5, 2);\n  ctx.fillStyle=shorts;            ctx.fillRect(cx+2-sw, py-12, 4, 7);\n  ctx.fillStyle=rgbStr(emp.skin);  ctx.fillRect(cx+2-sw, py-5,  4, 4);\n  ctx.fillStyle='#1a1a1a';         ctx.fillRect(cx+1-sw, py-2,  5, 2);\n  // torso / shirt\n  if (kit.type === 'stripes') {\n    for (let si = 0; si < 4; si++) {\n      ctx.fillStyle = si % 2 === 0 ? rgbStr(kit.c1) : rgbStr(kit.c2);\n      ctx.fillRect(cx-8 + si*4, py-28, 4, 18);\n    }\n  } else {\n    ctx.fillStyle = rgbStr(kit.c1);\n    ctx.fillRect(cx-8, py-28, 16, 18);\n  }\n  // arms (swing opposite to legs)\n  ctx.fillStyle = rgbStr(kit.c1);\n  ctx.fillRect(cx-11, py-26-aSw, 4, 12);\n  ctx.fillRect(cx+7,  py-26+aSw, 4, 12);\n  // head\n  ctx.fillStyle=rgbStr(emp.hair); ctx.fillRect(cx-8, py-46, 16, 8);\n  ctx.fillStyle=rgbStr(emp.skin); ctx.fillRect(cx-7, py-40, 14, 12);\n  // eyes (shift toward facing) + mouth\n  const ex = fc>0 ? 1 : -1;\n  ctx.fillStyle='#111'; ctx.fillRect(cx-4+ex, py-37, 2, 3); ctx.fillRect(cx+2+ex, py-37, 2, 3);\n  ctx.fillStyle='#aa6655'; ctx.fillRect(cx-2, py-31, 4, 2);\n  return { x:cx-13, y:py-48, w:26, h:52 };\n}\n\nfunction drawNameplate(cx, cy, emp, color) {\n  cx = Math.round(cx);\n  const top = Math.round(cy) - 64;\n  const w = Math.max(38, emp.name.length*7 + 12);\n  ctx.fillStyle='rgba(0,0,20,0.85)'; ctx.fillRect(cx-w/2, top, w, 13);\n  ctx.strokeStyle = color || '#4466aa'; ctx.lineWidth=1; ctx.strokeRect(cx-w/2, top, w, 13);\n  ctx.fillStyle = color || '#aabbee'; ctx.font='5px \"Press Start 2P\"'; ctx.textAlign='center';\n  ctx.fillText(emp.name, cx, top+9);\n}\n\n// ════════════════════════════════════════════\n//  ROUTINE AI — wander / pantry / foosball / colleague chats\n// ════════════════════════════════════════════\n// All durations are measured in render frames (≈60 fps).\nconst ROUTINE = {\n  // After arriving home, wait this long before considering leaving again.\n  idleAtDeskMin:   60 * 60,   // 60 s\n  idleAtDeskMax:   60 * 180,  // 180 s (≈3 min)\n  // Stay at a destination this long before walking back.\n  stayAtDestMin:   60 * 6,\n  stayAtDestMax:   60 * 14,\n  // Foosball gets its own (much longer) stay range — this is the \"AI 放鬆\"\n  // zone, not a blood-sweat office. Two engineers per match, ~45-90 s\n  // together at the table so a full game is visible.\n  foosballStayMin: 60 * 45,\n  foosballStayMax: 60 * 90,\n  // Per-frame chance to actually leave once eligible (low → calmer office).\n  leaveChance:     0.012,\n  // Grid units travelled per frame while WALKING.\n  walkSpeed:       0.035,\n  // At most this many engineers may be away from their desk at the same\n  // time, so the office never looks evacuated.\n  maxAway:         3,\n  // Benden patrols rarely — and never goes to the foosball table.\n  bendenLeaveScale: 0.35,\n};\n\n// Destinations the routine can pick — coordinates are \"standing tiles\"\n// (where the character ends up, not the furniture box itself).\nconst WANDER_SPOTS = {\n  get pantry() {\n    const { gx, gy } = DRAG_POSITIONS.coffee;\n    return [{ gx: gx + 0.85, gy: gy + 0.82 }, { gx: gx + 1.45, gy: gy + 0.82 }];\n  },\n  get foosball() {\n    return [\n      { gx: FOOSBALL_TABLE.gx + FOOSBALL_TABLE.w * 0.54, gy: FOOSBALL_TABLE.gy - 0.3 },\n      { gx: FOOSBALL_TABLE.gx + FOOSBALL_TABLE.w * 0.54, gy: FOOSBALL_TABLE.gy + 1.1 },\n    ];\n  },\n};\n\nfunction employeeDepth(emp) {\n  return emp.cx + emp.cy + EMPLOYEE_DEPTH_OFFSET;\n}\n\n// Meeting-table chair tiles — offsets are relative to the meeting-table origin\n// so the chairs always travel with the table when it is dragged.\nfunction getMeetingChairs() {\n  const { gx, gy } = DRAG_POSITIONS.meeting;\n  return [\n    { gx: gx - 0.8, gy: gy + 0.4 }, // head — reserved for Benden\n    { gx: gx - 0.8, gy: gy + 1.1 },\n    { gx: gx + 2.5, gy: gy + 0.4 },\n    { gx: gx + 2.5, gy: gy + 1.1 },\n    { gx: gx + 0.6, gy: gy + 1.7 },\n    { gx: gx + 1.4, gy: gy + 1.7 },\n  ];\n}\n\nfunction rndInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }\nfunction pick(arr)        { return arr[Math.floor(Math.random()*arr.length)]; }\n\nfunction countAway() {\n  let n = 0;\n  for (const e of EMPLOYEES) if (e.state !== 'AT_DESK' && !e.meetingLock) n++;\n  return n;\n}\n\nfunction sendTo(emp, dx, dy, destKind) {\n  emp.dx = dx; emp.dy = dy;\n  emp.destKind = destKind;\n  emp.state = 'WALKING';\n}\n\nfunction pickDestination(emp) {\n  // Choose a random destination kind weighted by typical engineer habits.\n  const r = Math.random();\n  if (emp.name === 'BENDEN') {\n    // Benden patrols: walk past a random colleague's desk, then back.\n    const others = EMPLOYEES.filter(e => e.name !== 'BENDEN');\n    const target = pick(others);\n    return { dx: target.homeX + 1.2, dy: target.homeY + 0.6, kind: 'colleague' };\n  }\n  if (r < 0.45) {\n    // Pantry chat needs TWO people to make the speech bubble believable.\n    // Pair-dispatch logic mirrors the foosball flow below; if no partner\n    // is free we fall through to a colleague chat instead of putting one\n    // lonely engineer at the coffee machine.\n    const partner = EMPLOYEES.find(e =>\n      e !== emp\n      && e.name !== 'BENDEN'\n      && e.state === 'AT_DESK'\n      && !e.meetingLock\n      && time >= (e.nextThinkAt || 0) - 60 * 30\n    );\n    if (partner && countAway() + 2 <= ROUTINE.maxAway) {\n      const spots = WANDER_SPOTS.pantry;\n      const myIdx = Math.floor(Math.random() * spots.length);\n      const partnerIdx = (myIdx + 1) % spots.length;\n      const stay = rndInt(ROUTINE.stayAtDestMin, ROUTINE.stayAtDestMax);\n      emp.pantryStay = stay;\n      partner.pantryStay = stay;\n      sendTo(partner, spots[partnerIdx].gx, spots[partnerIdx].gy, 'pantry');\n      return { dx: spots[myIdx].gx, dy: spots[myIdx].gy, kind: 'pantry' };\n    }\n    // No partner free — fall through to a colleague chat.\n  } else if (r < 0.70) {\n    // Foosball needs TWO players — find an eligible partner and dispatch\n    // them to the other foosball spot at the same time. If no partner is\n    // available, fall through to colleague chat so the table isn't\n    // occupied by a lonely player.\n    const partner = EMPLOYEES.find(e =>\n      e !== emp\n      && e.name !== 'BENDEN'\n      && e.state === 'AT_DESK'\n      && !e.meetingLock\n      && time >= (e.nextThinkAt || 0) - 60 * 30  // not currently mid-decision/cooldown\n    );\n    if (partner && countAway() + 2 <= ROUTINE.maxAway) {\n      const spots = WANDER_SPOTS.foosball;\n      const myIdx = Math.floor(Math.random() * spots.length);\n      const partnerIdx = (myIdx + 1) % spots.length;\n      // Sync stay-duration so both leave together (otherwise one would\n      // walk off and the table would briefly look like a 1-player game).\n      // Use the dedicated foosball range — a full match takes a while.\n      const stay = rndInt(ROUTINE.foosballStayMin, ROUTINE.foosballStayMax);\n      emp.foosballStay = stay;\n      partner.foosballStay = stay;\n      sendTo(partner, spots[partnerIdx].gx, spots[partnerIdx].gy, 'foosball');\n      return { dx: spots[myIdx].gx, dy: spots[myIdx].gy, kind: 'foosball' };\n    }\n    // No partner free — fall through to a colleague chat instead.\n  }\n  // Chat with a random colleague — stand in front of their desk.\n  const others = EMPLOYEES.filter(e => e !== emp && e.name !== 'BENDEN');\n  const target = pick(others);\n  return { dx: target.homeX + 1.1, dy: target.homeY + 0.6, kind: 'colleague' };\n}\n\nfunction tickEmployee(emp) {\n  if (emp.meetingLock) return; // meeting/RPG flow owns this character right now.\n\n  if (emp.state === 'WALKING') {\n    const dx = emp.dx - emp.cx, dy = emp.dy - emp.cy;\n    const dist = Math.hypot(dx, dy);\n    if (dist < ROUTINE.walkSpeed * 1.5) {\n      emp.cx = emp.dx; emp.cy = emp.dy;\n      if (emp.destKind === 'desk') {\n        emp.state = 'AT_DESK';\n        emp.nextThinkAt = time + rndInt(ROUTINE.idleAtDeskMin, ROUTINE.idleAtDeskMax);\n      } else {\n        emp.state = 'AT_DEST';\n        // Foosball / pantry pairs share a stay duration so both leave\n        // together (set by pickDestination); otherwise pick at random.\n        let stay;\n        if (emp.destKind === 'foosball' && emp.foosballStay) {\n          stay = emp.foosballStay;\n        } else if (emp.destKind === 'pantry' && emp.pantryStay) {\n          stay = emp.pantryStay;\n        } else {\n          stay = rndInt(ROUTINE.stayAtDestMin, ROUTINE.stayAtDestMax);\n        }\n        emp.foosballStay = 0;\n        emp.pantryStay = 0;\n        emp.stayUntil = time + stay;\n      }\n      return;\n    }\n    const step = ROUTINE.walkSpeed / dist;\n    emp.cx += dx * step;\n    emp.cy += dy * step;\n    return;\n  }\n\n  if (emp.state === 'AT_DEST') {\n    if (time >= emp.stayUntil) {\n      // Head home.\n      sendTo(emp, emp.homeX, emp.homeY, 'desk');\n    }\n    return;\n  }\n\n  // AT_DESK — decide whether to leave.\n  if (time < emp.nextThinkAt) return;\n  if (countAway() >= ROUTINE.maxAway) {\n    emp.nextThinkAt = time + 60 * 5; // try again in 5 s\n    return;\n  }\n  let chance = ROUTINE.leaveChance;\n  if (emp.name === 'BENDEN') chance *= ROUTINE.bendenLeaveScale;\n  if (Math.random() < chance) {\n    const d = pickDestination(emp);\n    sendTo(emp, d.dx, d.dy, d.kind);\n  } else {\n    // Re-roll soon rather than every frame.\n    emp.nextThinkAt = time + 30;\n  }\n}\n\nfunction tickRoutine() {\n  // Pause routine while any modal (info card / meeting / RPG) is open so\n  // the conversation focus isn't broken by background movement noise.\n  if (modalIsOpen()) return;\n  for (const e of EMPLOYEES) tickEmployee(e);\n}\n\nfunction modalIsOpen() {\n  return document.getElementById('card-overlay').classList.contains('active')\n      || document.getElementById('meeting-overlay').classList.contains('active')\n      || document.getElementById('leisure-overlay').classList.contains('active')\n      || document.getElementById('rpg-overlay').classList.contains('active');\n}\n\n// ════════════════════════════════════════════\n//  DATA: 1-on-1 dialog scripts (Benden ↔ engineer)\n//  Each line: { who: 'BENDEN' | <empName>, text: '...' }\n// ════════════════════════════════════════════\nconst EMP_DIALOGS = {\n  MORGAN: [\n    { who:'BENDEN', text:'Morgan，最近模組之間的接口還順嗎？' },\n    { who:'MORGAN', text:'大致上 OK，但 bonding 跟 etching 的訊號介面我想再對一次。' },\n    { who:'BENDEN', text:'好，下次站立會議排進去；需要我跟誰打招呼？' },\n    { who:'MORGAN', text:'你幫我喬 Brian 跟 Joy 一起對，他們兩個一進來就能收斂。' },\n    { who:'BENDEN', text:'沒問題，先把介面 spec 條列出來，我來下會議邀請。' },\n  ],\n  EVAN: [\n    { who:'BENDEN', text:'Evan，那批不良的 FA 進度怎麼樣？' },\n    { who:'EVAN',   text:'追到 bonding 介面有微裂，跟製程窗口的上緣有關。' },\n    { who:'BENDEN', text:'真的假的，那需要 Brian 一起 review。' },\n    { who:'EVAN',   text:'我已經把 SEM 截圖整理好，待會我們三個拉一下。' },\n    { who:'BENDEN', text:'好，先把 root cause 鎖住再來談 reaction plan。' },\n  ],\n  BRIAN: [\n    { who:'BENDEN', text:'Brian，bonding 良率這禮拜抓得起來嗎？' },\n    { who:'BRIAN',  text:'壓力跟溫度視窗有再窄一點，下個 run 我會盯著。' },\n    { who:'BENDEN', text:'機台有需要再借時段嗎？' },\n    { who:'BRIAN',  text:'再給我兩個 slot 我就能收斂；Jacob 那邊治具也升級了。' },\n    { who:'BENDEN', text:'OK，我跟 Lisa 喬一下排程。' },\n  ],\n  JACOB: [\n    { who:'BENDEN', text:'Jacob，新治具上線之後夾持還穩嗎？' },\n    { who:'JACOB',  text:'重複定位有壓下來，但邊角還有一點偏，再迭代一版。' },\n    { who:'BENDEN', text:'需要量測支援的話跟 Jason 講一聲。' },\n    { who:'JACOB',  text:'我已經跟他約好，等下午一起跑 Gage R&R。' },\n    { who:'BENDEN', text:'讚，數據出來幫我同步一下。' },\n  ],\n  JOY: [\n    { who:'BENDEN', text:'Joy，蝕刻均勻度有比較穩了嗎？' },\n    { who:'JOY',    text:'中心對邊緣縮到 ±3%，但長時間漂移還在調。' },\n    { who:'BENDEN', text:'有沒有需要 MZ 一起把 CTQ 重新對齊？' },\n    { who:'JOY',    text:'好啊，順便把反應計畫的觸發門檻重新校。' },\n    { who:'BENDEN', text:'我安排一個 30 分鐘的小會。' },\n  ],\n  JASON: [\n    { who:'BENDEN', text:'Jason，測試 flow 跑下來，瓶頸在哪？' },\n    { who:'JASON',  text:'功能測 OK，可靠度那段時間吃比較重。' },\n    { who:'BENDEN', text:'有沒有可以平行化的點？' },\n    { who:'JASON',  text:'可以拆成兩台同時跑，但需要 Jacob 幫我加一組 fixture。' },\n    { who:'BENDEN', text:'我去跟他講，你先把測試矩陣丟給我。' },\n  ],\n  MZ: [\n    { who:'BENDEN', text:'MZ，PFMEA 這版更新到哪了？' },\n    { who:'MZ',     text:'高風險項目已經跟 Evan 對過，反應計畫週末前出。' },\n    { who:'BENDEN', text:'CTQ 有沒有要往前推的？' },\n    { who:'MZ',     text:'有，我想把 bonding 介面的 CTQ 提到 P1，數字我有撐。' },\n    { who:'BENDEN', text:'我同意，會議我們一起跟客戶過一遍。' },\n  ],\n  LISA: [\n    { who:'BENDEN', text:'Lisa，下一個 milestone 還守得住嗎？' },\n    { who:'LISA',   text:'守得住，但 bonding 機台時段是瓶頸。' },\n    { who:'BENDEN', text:'我這邊看能不能借隔壁線的 slot。' },\n    { who:'LISA',   text:'拜託拜託，借到我就能把 buffer 留給 FA。' },\n    { who:'BENDEN', text:'OK，今天稍晚我給你答案。' },\n  ],\n  BENDEN: [\n    { who:'BENDEN', text:'（自言自語）今天先把幾個 risk 過一遍好了……' },\n    { who:'BENDEN', text:'良率、bonding、排程，這三條線都要追。' },\n    { who:'BENDEN', text:'晚點開一場小會把大家拉進來討論。' },\n  ],\n};\n\n// ════════════════════════════════════════════\n//  DATA: TOPIC → roles routing\n//  When Benden enters a meeting topic, we pick a \"lead\" + collaborators\n//  based on keyword hits. Always includes Benden at the head of the table.\n// ════════════════════════════════════════════\nconst TOPIC_ROUTES = [\n  { keys:['風險','risk'],                lead:'RISK',   collab:['MZ','EVAN'] },\n  { keys:['良率','yield'],                lead:'MZ',     collab:['JASON','EVAN'] },\n  { keys:['失效','不良','FA','fa'],       lead:'EVAN',   collab:['MZ','BRIAN'] },\n  { keys:['蝕刻','etch'],                 lead:'JOY',    collab:['BRIAN','JACOB'] },\n  { keys:['接合','bond'],                 lead:'BRIAN',  collab:['JOY','JACOB'] },\n  { keys:['治具','機構','mechanical'],    lead:'JACOB',  collab:['BRIAN'] },\n  { keys:['測試','量測','test'],          lead:'JASON',  collab:['MZ'] },\n  { keys:['排程','進度','planner','schedule'], lead:'LISA', collab:['MORGAN'] },\n  { keys:['整合','系統','integration'],   lead:'MORGAN', collab:['BRIAN','JOY'] },\n];\n\nfunction routeTopic(topic) {\n  const t = (topic || '').toLowerCase();\n  for (const r of TOPIC_ROUTES) {\n    if (r.keys.some(k => t.includes(k.toLowerCase()))) {\n      return { lead: r.lead, collab: r.collab };\n    }\n  }\n  // Generic fallback — quality-first triage.\n  return { lead: 'MZ', collab: ['MORGAN','EVAN','BRIAN'] };\n}\n\n\n// ════════════════════════════════════════════\n//  FOOTBALL MATCH SIMULATION (FIFA 2026)\n//  The 10 engineers split into two teams and play an autonomous match.\n//  Ball = simple physics (friction + little arcs). Players: one chaser per\n//  team goes for the ball, everyone else holds a ball-shifted formation slot.\n// ════════════════════════════════════════════\nconst ball = { x:6, y:4, z:0, vx:0, vy:0, vz:0, kickCd:0 };\nlet scoreA = 0, scoreB = 0;\nlet celebrateT = 0, goalFlash = 0;\nlet chaserA = null, chaserB = null;\n\n// ── optional human control of one player ──\nlet controlEnabled = false;\nlet controlled = null;\nconst keys = { up:false, down:false, left:false, right:false, kick:false };\nconst ctrlDir = { x:0, y:0 };\n\nfunction drawControlMarker(cx, cy) {\n  cx = Math.round(cx);\n  const bob = Math.sin(time*0.15)*2;\n  const y = Math.round(cy) - 80 + bob;\n  ctx.fillStyle = '#ffe066';\n  ctx.beginPath();\n  ctx.moveTo(cx-6, y); ctx.lineTo(cx+6, y); ctx.lineTo(cx, y+7); ctx.closePath(); ctx.fill();\n  ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.stroke();\n}\n\nfunction tickControlled() {\n  const e = controlled;\n  let mx = 0, my = 0;                 // iso basis vectors per key\n  if (keys.up)    { mx -= 0.5; my -= 0.5; }\n  if (keys.down)  { mx += 0.5; my += 0.5; }\n  if (keys.left)  { mx -= 0.5; my += 0.5; }\n  if (keys.right) { mx += 0.5; my -= 0.5; }\n  const ml = Math.hypot(mx, my);\n  if (ml > 0) {\n    mx /= ml; my /= ml;\n    ctrlDir.x = mx; ctrlDir.y = my;\n    const sp = 0.06;\n    e.cx = Math.max(0.4, Math.min(11.6, e.cx + mx*sp));\n    e.cy = Math.max(0.4, Math.min(7.6, e.cy + my*sp));\n    e.moving = true;\n    const sdx = mx - my; if (Math.abs(sdx) > 0.001) e.face = sdx > 0 ? 1 : -1;\n  } else {\n    e.moving = false;\n  }\n  const dball = Math.hypot(ball.x - e.cx, ball.y - e.cy);\n  // dribble — keep the ball at the feet while running\n  if (dball < 0.55 && ball.z < 10 && !keys.kick && ml > 0) {\n    ball.vx = ctrlDir.x * 0.055; ball.vy = ctrlDir.y * 0.055;\n  }\n  // shoot\n  if (keys.kick && dball < 0.78 && ball.z < 14 && ball.kickCd <= 0) {\n    let kx = ctrlDir.x, ky = ctrlDir.y;\n    if (kx === 0 && ky === 0) {                 // standing still → aim at goal\n      const gX = e.team === 'A' ? 12 : 0;\n      let ax = gX - e.cx, ay = 4 - e.cy; const an = Math.hypot(ax, ay) || 1;\n      kx = ax/an; ky = ay/an;\n    }\n    ball.vx = kx * 0.26; ball.vy = ky * 0.26; ball.vz = 4 + Math.random()*3;\n    ball.kickCd = 14;\n  }\n}\n\nfunction lineSeg(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }\n\nfunction moveToward(e, tx, ty, sp) {\n  const dx = tx - e.cx, dy = ty - e.cy;\n  const d = Math.hypot(dx, dy);\n  if (d < 0.015) { e.moving = false; return; }\n  const step = Math.min(sp, d);\n  e.cx += dx / d * step;\n  e.cy += dy / d * step;\n  e.moving = step > 0.006;\n  const sdx = dx - dy;                       // screen-x component (iso)\n  if (Math.abs(sdx) > 0.0015) e.face = sdx > 0 ? 1 : -1;\n}\n\nfunction kickByPlayer(e) {\n  const goalX = e.team === 'A' ? 12 : 0;     // attacking direction\n  const goalY = 4 + (Math.random() - 0.5) * 1.3;\n  let ax = goalX - e.cx, ay = goalY - e.cy;\n  const an = Math.hypot(ax, ay) || 1; ax /= an; ay /= an;\n  const noise = (Math.random() - 0.5) * 0.55;       // aim spread\n  const cs = Math.cos(noise), sn = Math.sin(noise);\n  const rx = ax * cs - ay * sn, ry = ax * sn + ay * cs;\n  const nearGoal = Math.abs(goalX - e.cx) < 4;\n  const power = 0.15 + Math.random() * 0.12 + (nearGoal ? 0.05 : 0);\n  ball.vx = rx * power;\n  ball.vy = ry * power;\n  ball.vz = 2.5 + Math.random() * 4.5;              // little arc\n  ball.kickCd = 14;\n}\n\nfunction tickPlayer(e) {\n  const dball = Math.hypot(ball.x - e.cx, ball.y - e.cy);\n  let tx, ty, sp;\n  if (e.frole === 'GK') {\n    const goalX = e.team === 'A' ? 0.8 : 11.2;\n    const nearOwn = e.team === 'A' ? ball.x < 2.6 : ball.x > 9.4;\n    if (nearOwn) { tx = e.team === 'A' ? Math.min(2.2, ball.x) : Math.max(9.8, ball.x); ty = ball.y; sp = 0.05; }\n    else         { tx = goalX; ty = Math.max(3.2, Math.min(4.8, ball.y)); sp = 0.03; }\n  } else if (e === chaserA || e === chaserB) {\n    tx = ball.x; ty = ball.y; sp = 0.05;\n  } else {\n    tx = e.fx + (ball.x - 6) * 0.34;          // team shape slides with the ball\n    ty = e.fy + (ball.y - 4) * 0.42;\n    sp = 0.028;\n  }\n  tx = Math.max(0.5, Math.min(11.5, tx));\n  ty = Math.max(0.6, Math.min(7.4, ty));\n  moveToward(e, tx, ty, sp);\n  if (dball < 0.55 && ball.z < 14 && ball.kickCd <= 0) kickByPlayer(e);\n}\n\nfunction scoreGoal(team) {\n  if (team === 'A') scoreA++; else scoreB++;\n  goalFlash = 100; celebrateT = 130;\n  ball.x = 6; ball.y = 4; ball.z = 0; ball.vx = ball.vy = ball.vz = 0;\n}\n\nfunction kickoff() {\n  ball.x = 6; ball.y = 4; ball.z = 0;\n  const dir = Math.random() < 0.5 ? 1 : -1;\n  ball.vx = dir * 0.06; ball.vy = (Math.random() - 0.5) * 0.05; ball.vz = 0;\n}\n\nfunction tickMatch() {\n  if (modalIsOpen()) return;\n\n  // ── ball physics (paused during a goal celebration) ──\n  if (celebrateT <= 0) {\n    ball.x += ball.vx; ball.y += ball.vy;\n    ball.z += ball.vz; ball.vz -= 0.45;\n    if (ball.z <= 0) { ball.z = 0; ball.vz = (ball.vz < -1.2) ? -ball.vz * 0.45 : 0; }\n    const fr = ball.z <= 0.5 ? 0.975 : 0.992;\n    ball.vx *= fr; ball.vy *= fr;\n    if (Math.abs(ball.vx) < 0.0008) ball.vx = 0;\n    if (Math.abs(ball.vy) < 0.0008) ball.vy = 0;\n    // sidelines (gy)\n    if (ball.y < 0.35) { ball.y = 0.35; ball.vy = Math.abs(ball.vy) * 0.6; }\n    if (ball.y > 7.65) { ball.y = 7.65; ball.vy = -Math.abs(ball.vy) * 0.6; }\n    // goal lines (gx) — into the mouth (gy 3..5, low ball) = GOAL, else bounce off\n    const inMouth = ball.y > 3.05 && ball.y < 4.95;\n    if (ball.x < 0.18) {\n      if (inMouth && ball.z < 26) { scoreGoal('B'); }\n      else { ball.x = 0.35; ball.vx = Math.abs(ball.vx) * 0.55; }\n    } else if (ball.x > 11.82) {\n      if (inMouth && ball.z < 26) { scoreGoal('A'); }\n      else { ball.x = 11.65; ball.vx = -Math.abs(ball.vx) * 0.55; }\n    }\n    if (ball.kickCd > 0) ball.kickCd--;\n  }\n\n  // ── players ──\n  if (celebrateT > 0) {\n    celebrateT--;\n    EMPLOYEES.forEach(e => moveToward(e, e.fx, e.fy, 0.03));  // jog back into shape\n    if (celebrateT === 0) kickoff();\n    return;\n  }\n  // nearest outfield player on each team chases the ball\n  chaserA = chaserB = null;\n  let bdA = 1e9, bdB = 1e9;\n  EMPLOYEES.forEach(e => {\n    if (e.frole === 'GK' || e === controlled) return;\n    const d = Math.hypot(ball.x - e.cx, ball.y - e.cy);\n    if (e.team === 'A') { if (d < bdA) { bdA = d; chaserA = e; } }\n    else                { if (d < bdB) { bdB = d; chaserB = e; } }\n  });\n  EMPLOYEES.forEach(e => { if (e !== controlled) tickPlayer(e); });\n  if (controlled) tickControlled();\n}\n\n// ── ball sprite ──\nfunction drawBall() {\n  const sx = isoX(ball.x, ball.y), sy = isoY(ball.x, ball.y);\n  ctx.fillStyle = 'rgba(0,0,0,0.28)';\n  ctx.beginPath(); ctx.ellipse(sx, sy, 4, 2, 0, 0, Math.PI*2); ctx.fill();\n  const cyb = sy - ball.z - 3;\n  ctx.fillStyle = '#ffffff';\n  ctx.beginPath(); ctx.arc(sx, cyb, 4, 0, Math.PI*2); ctx.fill();\n  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1; ctx.stroke();\n  ctx.fillStyle = '#111';\n  ctx.fillRect(sx-1, cyb-1, 2, 2);\n  ctx.fillRect(sx-3, cyb+1, 1, 1);\n  ctx.fillRect(sx+2, cyb+1, 1, 1);\n}\n\n// ── goal frame + net ──\nfunction drawNet(p1, p2, b1, b2, h) {\n  c
